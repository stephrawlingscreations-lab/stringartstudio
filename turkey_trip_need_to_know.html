<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Turkey Trip">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F3E9">
<meta name="robots" content="noindex, nofollow">
<title>Turkey Trip — Need to Know</title>
<link rel="icon" href="images/logo.png">
<style>
  :root {
    --navy: #1B2A4A;
    --gold: #B8912F;
    --cream: #F7F3E9;
    --dark: #2A2A2A;
    --border: #e4ddc9;
    --muted: #7a7566;
    --soft: #8a8365;
    --err: #a34a2f;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--cream);
    color: var(--dark);
    margin: 0;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  #auth-loading, #login-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(145deg, #1B2A4A 0%, #2f4468 55%, #B8912F 140%);
  }
  #login-screen { display: none; }
  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .login-logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #1B2A4A, #B8912F);
    border-radius: 18px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .login-card h1 { font-size: 1.4rem; font-weight: 700; color: var(--navy); margin: 0 0 6px; }
  .login-card p { font-size: 0.9rem; color: var(--muted); margin: 0 0 28px; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px 20px;
    background: #fff; border: 2px solid var(--border);
    border-radius: 12px; cursor: pointer;
    font-size: 0.95rem; font-weight: 600; color: var(--navy);
    font-family: inherit;
  }
  .btn-google:active { background: var(--cream); }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
  #login-error {
    margin-top: 14px; font-size: 0.85rem; color: var(--err); min-height: 20px;
  }
  .auth-spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #trip-app { display: none; }
  #trip-app.is-ready { display: block; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding:
      calc(16px + var(--safe-top))
      14px
      calc(48px + var(--safe-bottom));
  }

  .hub-back-btn {
    display: inline-block;
    margin: 0 0 14px;
    background: rgba(27, 42, 74, 0.92);
    color: #fff;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }
  .hub-back-btn:active { opacity: 0.85; }

  header { margin-bottom: 14px; }
  header h1 {
    color: var(--navy);
    font-size: 1.45rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header .meta {
    color: var(--gold);
    font-size: 0.85rem;
    margin: 0;
    font-weight: 600;
  }
  .countdown {
    display: inline-block;
    margin-top: 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--navy);
  }

  .jump {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 0 14px;
    margin: 0 -2px 4px;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(var(--cream) 70%, rgba(247, 243, 233, 0));
    padding-top: 8px;
  }
  .jump::-webkit-scrollbar { display: none; }
  .jump a {
    flex: 0 0 auto;
    text-decoration: none;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--navy);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .quick {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .quick a {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--navy);
    color: var(--cream);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 12px;
  }
  .quick a.secondary {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid var(--navy);
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px 16px;
    margin-bottom: 14px;
    scroll-margin-top: 56px;
  }
  .card h2 {
    color: var(--navy);
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .emoji { font-size: 1.05rem; line-height: 1; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid #f0ece0;
    font-size: 0.88rem;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label { color: var(--muted); flex-shrink: 0; max-width: 46%; }
  .detail-row .value {
    text-align: right;
    font-weight: 600;
    color: var(--dark);
    word-break: break-word;
  }
  .detail-row .value a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
  }

  .copyable {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-weight: 600;
    color: var(--dark);
    cursor: pointer;
    text-align: right;
  }
  .copyable .chip {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--navy);
    background: #efe8d4;
    border-radius: 6px;
    padding: 2px 6px;
  }
  .copyable.copied .chip {
    background: #dcead9;
    color: #2f6b3a;
  }

  .subhead {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gold);
    font-weight: 700;
    margin: 14px 0 4px;
  }
  .subhead:first-of-type { margin-top: 0; }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .btn {
    display: inline-block;
    background: var(--navy);
    color: var(--cream);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 999px;
  }
  .btn.secondary {
    background: transparent;
    color: var(--navy);
    border: 1.5px solid var(--navy);
  }

  .note {
    font-size: 0.78rem;
    color: var(--soft);
    line-height: 1.5;
    margin-top: 10px;
  }

  .emergency-card {
    background: #f9efe9;
    border: 1px solid #e6c8b3;
  }
  .emergency-card h2 { color: #99401d; }
  .emergency-card .value,
  .emergency-card .value a { color: #99401d; }
  .emergency-card .value a { border-bottom-color: #c98a68; }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #a19c88;
    margin-top: 18px;
    line-height: 1.5;
  }

  .conv-row {
    display: flex;
    align-items: center;
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    min-height: 52px;
  }
  .conv-row:focus-within { border-color: var(--gold); }
  .conv-flag { font-size: 1.35rem; width: 30px; text-align: center; flex-shrink: 0; }
  .conv-code { color: var(--navy); font-weight: 700; font-size: 0.85rem; width: 46px; flex-shrink: 0; }
  .conv-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--dark);
    background: transparent;
    text-align: right;
    min-width: 0;
    font-family: inherit;
    padding: 4px 0;
  }
  .conv-status {
    text-align: center;
    font-size: 0.75rem;
    color: #6b6b6b;
    margin-top: 6px;
    line-height: 1.45;
    min-height: 2.2em;
  }
  .conv-status.live { color: var(--navy); }
  .conv-status.err { color: var(--err); }
  .conv-status.loading { color: var(--soft); }
  .conv-refresh {
    display: block;
    width: 100%;
    max-width: 200px;
    margin: 12px auto 0;
    background: var(--navy);
    color: var(--cream);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .conv-refresh:disabled { opacity: 0.55; }
  .conv-manual-toggle {
    text-align: center;
    margin-top: 12px;
    font-size: 0.75rem;
    color: var(--soft);
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
    user-select: none;
  }
  .conv-manual-box {
    margin-top: 8px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .conv-manual-box label {
    display: block;
    font-size: 0.72rem;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .conv-manual-box input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    margin-bottom: 8px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    background: #fff;
  }
  .conv-manual-box input:last-child { margin-bottom: 0; }
  .conv-full {
    display: block;
    text-align: center;
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--navy);
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="auth-loading"><div class="auth-spinner" aria-label="Loading"></div></div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🇹🇷</div>
    <h1>Turkey Trip</h1>
    <p>Sign in with your Hub Google account to open this private page</p>
    <button type="button" class="btn-google" id="btnSignIn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <div id="login-error"></div>
  </div>
</div>

<div id="trip-app">
  <div class="wrap" id="trip-root"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function () {
  firebase.initializeApp({
    apiKey:            'AIzaSyAcSc-3ejzUfaiods7fAGAH10EuVvZaL6U',
    authDomain:        'steph-rawlings-creations.firebaseapp.com',
    databaseURL:       'https://steph-rawlings-creations-default-rtdb.europe-west1.firebasedatabase.app',
    projectId:         'steph-rawlings-creations',
    storageBucket:     'steph-rawlings-creations.firebasestorage.app',
    messagingSenderId: '271810785275',
    appId:             '1:271810785275:web:e44be9608f17386ae4e55e'
  });

  var fbAuth = firebase.auth();
  var fbDb = firebase.database();
  var FB_PATH = 'turkeyTrip';
  var ALLOWED = [
    'stephrawlingscreations@gmail.com',
    'sdr22ie@gmail.com',
    'sdr22uk@gmail.com'
  ];
  var pendingDisallow = '';
  var tripReady = false;
  var converterStarted = false;

  // Trip details live only in Firebase (turkeyTrip) after Hub login.
  // Never ship booking refs / personal details in this public HTML file.

  function isAllowed(email) {
    return ALLOWED.some(function (a) {
      return a.toLowerCase() === String(email || '').toLowerCase();
    });
  }

  function showPhase(phase) {
    document.getElementById('auth-loading').style.display = phase === 'loading' ? 'flex' : 'none';
    document.getElementById('login-screen').style.display = phase === 'login' ? 'flex' : 'none';
    var app = document.getElementById('trip-app');
    if (phase === 'app') app.classList.add('is-ready');
    else app.classList.remove('is-ready');
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function copyBtn(value) {
    return '<button type="button" class="copyable" data-copy="' + esc(value) + '" aria-label="Copy ' + esc(value) + '">' +
      esc(value) + ' <span class="chip">Copy</span></button>';
  }

  function row(label, valueHtml) {
    return '<div class="detail-row"><span class="label">' + esc(label) + '</span><span class="value">' + valueHtml + '</span></div>';
  }

  function countdownText(flyDate) {
    var parts = String(flyDate || '2026-09-07').split('-');
    var start = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    start.setHours(0, 0, 0, 0);
    var days = Math.round((start - today) / 86400000);
    if (days > 1) return days + ' days until you fly';
    if (days === 1) return 'Tomorrow — flying day prep';
    if (days === 0) return 'Flying today — safe travels';
    if (days >= -8) return 'You\'re away / just back — enjoy';
    return 'Trip dates saved';
  }

  function renderTrip(data) {
    var e = data.emergency || {};
    var f = data.flights || {};
    var h = data.hotel || {};
    var p = data.parking || {};
    var i = data.insurance || {};
    var s = data.esim || {};
    var dogs = Array.isArray(data.dogs) ? data.dogs : [];
    var cignaTel = (e.rows && e.rows[2] && e.rows[2].tel) || '+18002431348';
    var mawdyTel = (e.rows && e.rows[0] && e.rows[0].tel) || '+35391560637';

    var emergencyRows = (e.rows || []).map(function (r) {
      return row(r.label, '<a href="tel:' + esc(r.tel) + '">' + esc(r.display || r.tel) + '</a>');
    }).join('');

    var dogRows = dogs.map(function (d) {
      return row(d.label, esc(d.value));
    }).join('');

    document.getElementById('trip-root').innerHTML =
      '<a href="/portal/" class="hub-back-btn">← Hub</a>' +
      '<header>' +
        '<h1>' + esc(data.title || 'Turkey trip') + '</h1>' +
        '<p class="meta">' + esc(data.meta || '') + '</p>' +
        '<div class="countdown" id="countdown">' + esc(countdownText(data.flyDate)) + '</div>' +
      '</header>' +
      '<nav class="jump" aria-label="Jump to section">' +
        '<a href="#emergency">Emergency</a><a href="#converter">Currency</a><a href="#flights">Flights</a>' +
        '<a href="#hotel">Hotel</a><a href="#parking">Parking</a><a href="#insurance">Insurance</a>' +
        '<a href="#esim">eSIM</a><a href="#dogs">Dogs</a>' +
      '</nav>' +
      '<div class="quick">' +
        '<a href="tel:' + esc(cignaTel) + '">Call Cigna</a>' +
        '<a class="secondary" href="https://www.ryanair.com/ie/en/lp/check-in" target="_blank" rel="noopener">Ryanair check-in</a>' +
        '<a class="secondary" href="https://www.tui.ie/managemybooking" target="_blank" rel="noopener">TUI booking</a>' +
        '<a href="tel:' + esc(mawdyTel) + '">Call MAWDY</a>' +
      '</div>' +
      '<section class="card emergency-card" id="emergency">' +
        '<h2><span class="emoji" aria-hidden="true">🚨</span>Emergency numbers</h2>' +
        emergencyRows +
        '<div class="note">' + esc(e.note || '') + '</div>' +
      '</section>' +
      '<section class="card" id="converter">' +
        '<h2><span class="emoji" aria-hidden="true">💱</span>Currency converter</h2>' +
        '<div id="converter-app"></div>' +
        '<a class="conv-full" href="/currency_converter.html">Open full-screen converter →</a>' +
      '</section>' +
      '<section class="card" id="flights">' +
        '<h2><span class="emoji" aria-hidden="true">✈️</span>Flights</h2>' +
        '<div class="subhead">' + esc(f.outboundLabel || '') + '</div>' +
        row(f.outboundCode || 'Flight', esc(f.outboundRoute || '')) +
        row('Departs / arrives', esc(f.outboundTimes || '')) +
        '<div class="subhead">' + esc(f.returnLabel || '') + '</div>' +
        row(f.returnCode || 'Flight', esc(f.returnRoute || '')) +
        row('Departs / arrives', esc(f.returnTimes || '')) +
        row('Booking ref', copyBtn(f.bookingRef || '')) +
        '<div class="btn-row">' +
          '<a class="btn" href="https://www.ryanair.com/ie/en/lp/check-in" target="_blank" rel="noopener">Check in</a>' +
          '<a class="btn secondary" href="https://www.dublinairport.com/flight-information/departures" target="_blank" rel="noopener">Dublin departures</a>' +
        '</div>' +
        '<div class="note">' + esc(f.note || '') + '</div>' +
      '</section>' +
      '<section class="card" id="hotel">' +
        '<h2><span class="emoji" aria-hidden="true">🏨</span>Hotel &amp; transfer</h2>' +
        row('Hotel', esc(h.name || '')) +
        row('Board', esc(h.board || '')) +
        row('Room', esc(h.room || '')) +
        row('TUI booking ref', copyBtn(h.tuiRef || '')) +
        row('Transfer', esc(h.transfer || '')) +
        '<div class="btn-row">' +
          '<a class="btn" href="https://www.tui.ie/managemybooking" target="_blank" rel="noopener">Manage TUI booking</a>' +
          '<a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=' + esc(h.mapQuery || '') + '" target="_blank" rel="noopener">Map hotel</a>' +
        '</div>' +
      '</section>' +
      '<section class="card" id="parking">' +
        '<h2><span class="emoji" aria-hidden="true">🅿️</span>Dublin Airport parking</h2>' +
        row('Provider', esc(p.provider || '')) +
        row('Booking ref', copyBtn(p.bookingRef || '')) +
        row('Car reg', copyBtn(p.carReg || '')) +
        row('Entry', esc(p.entry || '')) +
        row('Exit', esc(p.exit || '')) +
        row('Address', esc(p.address || '')) +
        row('Return pickup', esc(p.pickup || '')) +
        '<div class="btn-row">' +
          '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + esc(p.mapQuery || '') + '" target="_blank" rel="noopener">Directions</a>' +
          '<a class="btn secondary" href="https://park2travel.ie" target="_blank" rel="noopener">Manage booking</a>' +
        '</div>' +
      '</section>' +
      '<section class="card" id="insurance">' +
        '<h2><span class="emoji" aria-hidden="true">🛡️</span>Travel insurance</h2>' +
        '<div class="subhead">ATI / Multitrip.com (MAWDY)</div>' +
        row('Certificate no.', copyBtn(i.atiCert || '')) +
        row('Cover', esc(i.atiCover || '')) +
        '<div class="subhead">Cigna Global Health Benefits (MBA)</div>' +
        row('Account', esc(i.cignaAccount || '')) +
        row('Cover', esc(i.cignaCover || '')) +
        '<div class="btn-row">' +
          '<a class="btn" href="https://www.cignaenvoy.com" target="_blank" rel="noopener">Cigna Envoy</a>' +
          '<a class="btn secondary" href="https://www.annualtravelinsurance.com" target="_blank" rel="noopener">ATI / Multitrip</a>' +
        '</div>' +
      '</section>' +
      '<section class="card" id="esim">' +
        '<h2><span class="emoji" aria-hidden="true">📶</span>eSIMs</h2>' +
        row('Provider', esc(s.provider || '')) +
        row('Steph\'s eSIM', esc(s.steph || '')) +
        row('Caz\'s eSIM', esc(s.caz || '')) +
        '<div class="note">' + esc(s.note || '') + '</div>' +
        '<div class="btn-row"><a class="btn" href="https://esim.holafly.com" target="_blank" rel="noopener">Holafly account</a></div>' +
      '</section>' +
      '<section class="card" id="dogs">' +
        '<h2><span class="emoji" aria-hidden="true">🐾</span>Dog care handover</h2>' +
        dogRows +
      '</section>' +
      '<footer>Private Hub page — sign-in required.<br>Live rates need internet — last good rates stay cached on this phone.</footer>';

    document.querySelectorAll('.copyable').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var text = btn.getAttribute('data-copy') || '';
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          btn.classList.add('copied');
          var chip = btn.querySelector('.chip');
          if (chip) chip.textContent = 'Copied';
          setTimeout(function () {
            btn.classList.remove('copied');
            if (chip) chip.textContent = 'Copy';
          }, 1400);
        } catch (_) { /* ignore */ }
      });
    });

    startConverter();
  }

  async function loadTripData() {
    var snap = await fbDb.ref(FB_PATH).once('value');
    var cloud = snap.val();
    if (cloud && cloud.flights) return cloud;
    return null;
  }

  function renderEmptyTrip() {
    document.getElementById('trip-root').innerHTML =
      '<a href="/portal/" class="hub-back-btn">← Hub</a>' +
      '<header>' +
        '<h1>Turkey trip — need to know</h1>' +
        '<p class="meta">Private Hub page</p>' +
      '</header>' +
      '<section class="card">' +
        '<h2>No trip details in the cloud yet</h2>' +
        '<p class="note" style="margin-top:0">Sign-in worked, but Firebase has no saved trip payload. ' +
        'If you opened this page while signed in before the security update, try refreshing. ' +
        'Otherwise restore from a Hub backup or ask to re-import the trip details into Firebase.</p>' +
        '<div class="btn-row" style="margin-top:14px">' +
          '<a class="btn" href="/portal/">Back to Hub</a>' +
          '<a class="btn secondary" href="/currency_converter.html">Open converter</a>' +
        '</div>' +
      '</section>';
  }

  function startConverter() {
    if (converterStarted) return;
    var root = document.getElementById('converter-app');
    if (!root) return;
    converterStarted = true;

    var STORAGE_KEY = 'liraConverterRates_v1';
    var RATE_URL = 'https://open.er-api.com/v6/latest/TRY';
    var currencies = [
      { code: 'TRY', flag: '\u{1F1F9}\u{1F1F7}', label: 'Turkish Lira' },
      { code: 'EUR', flag: '\u{1F1EA}\u{1F1FA}', label: 'Euro' },
      { code: 'GBP', flag: '\u{1F1EC}\u{1F1E7}', label: 'British Pound' }
    ];
    var ratesFromTRY = { TRY: 1, EUR: 1 / 55.1, GBP: 1 / 64.4 };
    var lastUpdated = null;
    var liveOk = false;
    var fetching = false;
    var amounts = { TRY: '1000', EUR: '', GBP: '' };
    var lastEdited = 'TRY';
    var manualOpen = false;

    function loadCachedRates() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        if (data && data.rates && data.rates.EUR && data.rates.GBP) {
          ratesFromTRY = { TRY: 1, EUR: Number(data.rates.EUR), GBP: Number(data.rates.GBP) };
          if (data.updatedAt) lastUpdated = new Date(data.updatedAt);
        }
      } catch (_) { /* ignore */ }
    }

    function saveCachedRates() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          rates: { EUR: ratesFromTRY.EUR, GBP: ratesFromTRY.GBP },
          updatedAt: (lastUpdated || new Date()).toISOString()
        }));
      } catch (_) { /* ignore */ }
    }

    function formatAmount(n) {
      return n.toLocaleString('en-IE', { maximumFractionDigits: 2 });
    }

    function updateOtherAmounts(editedCode, rawValue) {
      var val = parseFloat(String(rawValue).replace(/,/g, ''));
      amounts[editedCode] = rawValue;
      lastEdited = editedCode;
      currencies.forEach(function (c) {
        if (c.code === editedCode) return;
        var input = root.querySelector('input[data-code="' + c.code + '"]');
        if (isNaN(val)) {
          amounts[c.code] = '';
          if (input) input.value = '';
          return;
        }
        var baseInTRY = val / ratesFromTRY[editedCode];
        var converted = formatAmount(baseInTRY * ratesFromTRY[c.code]);
        amounts[c.code] = converted;
        if (input) input.value = converted;
      });
    }

    function statusText() {
      if (fetching) return { text: 'Updating live rates\u2026', cls: 'loading' };
      if (liveOk && lastUpdated) {
        return {
          text: '\u2713 Live rates \u00b7 updated ' + lastUpdated.toLocaleString('en-IE', {
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
          }),
          cls: 'live'
        };
      }
      if (lastUpdated) {
        return {
          text: '\u26a0 Using rates from ' + lastUpdated.toLocaleString('en-IE', {
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
          }) + ' — tap refresh when online',
          cls: 'err'
        };
      }
      return { text: '\u26a0 Using saved approx rates — check connection and tap refresh', cls: 'err' };
    }

    function updateStatus() {
      var st = statusText();
      var el = root.querySelector('#convStatus');
      if (el) {
        el.className = 'conv-status ' + st.cls;
        el.textContent = st.text;
      }
      var btn = root.querySelector('#refreshBtn');
      if (btn) {
        btn.disabled = fetching;
        btn.textContent = fetching ? 'Updating\u2026' : 'Refresh rates';
      }
    }

    async function fetchLiveRates() {
      if (fetching) return;
      fetching = true;
      updateStatus();
      try {
        var res = await fetch(RATE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        if (data && data.rates && data.rates.EUR && data.rates.GBP) {
          ratesFromTRY = { TRY: 1, EUR: data.rates.EUR, GBP: data.rates.GBP };
          liveOk = true;
          lastUpdated = new Date();
          saveCachedRates();
          updateOtherAmounts(lastEdited, amounts[lastEdited] || '1000');
          if (manualOpen) syncManualInputs();
        } else {
          throw new Error('bad data');
        }
      } catch (e) {
        liveOk = false;
      } finally {
        fetching = false;
        updateStatus();
      }
    }

    function syncManualInputs() {
      var eurInput = root.querySelector('#manualEUR');
      var gbpInput = root.querySelector('#manualGBP');
      if (eurInput) eurInput.value = (1 / ratesFromTRY.EUR).toFixed(2);
      if (gbpInput) gbpInput.value = (1 / ratesFromTRY.GBP).toFixed(2);
    }

    function applyManualRate(code, tryPerUnit) {
      var v = parseFloat(String(tryPerUnit).replace(/,/g, ''));
      if (isNaN(v) || v <= 0) return;
      ratesFromTRY[code] = 1 / v;
      liveOk = false;
      lastUpdated = new Date();
      saveCachedRates();
      updateOtherAmounts(lastEdited, amounts[lastEdited] || '1000');
      updateStatus();
    }

    function bindRowInputs() {
      currencies.forEach(function (c) {
        var input = root.querySelector('input[data-code="' + c.code + '"]');
        if (!input) return;
        input.addEventListener('input', function (e) {
          updateOtherAmounts(c.code, e.target.value);
        });
        input.addEventListener('focus', function (e) {
          setTimeout(function () { e.target.select(); }, 0);
        });
      });
    }

    function bindManual() {
      var eurInput = root.querySelector('#manualEUR');
      var gbpInput = root.querySelector('#manualGBP');
      if (!eurInput || !gbpInput) return;
      eurInput.addEventListener('change', function () { applyManualRate('EUR', eurInput.value); });
      gbpInput.addEventListener('change', function () { applyManualRate('GBP', gbpInput.value); });
    }

    function render() {
      var st = statusText();
      root.innerHTML =
        currencies.map(function (c) {
          return (
            '<div class="conv-row">' +
              '<div class="conv-flag" aria-hidden="true">' + c.flag + '</div>' +
              '<div class="conv-code">' + c.code + '</div>' +
              '<input class="conv-input" data-code="' + c.code + '" type="text" inputmode="decimal" ' +
                'enterkeyhint="done" autocomplete="off" spellcheck="false" ' +
                'value="' + amounts[c.code] + '" placeholder="0" aria-label="' + c.label + '" />' +
            '</div>'
          );
        }).join('') +
        '<div id="convStatus" class="conv-status ' + st.cls + '">' + st.text + '</div>' +
        '<button type="button" class="conv-refresh" id="refreshBtn"' +
          (fetching ? ' disabled' : '') + '>' +
          (fetching ? 'Updating\u2026' : 'Refresh rates') +
        '</button>' +
        '<div class="conv-manual-toggle" id="manualToggle" role="button" tabindex="0">' +
          (manualOpen ? 'Hide manual rates' : 'Enter rates manually') +
        '</div>' +
        (manualOpen
          ? '<div class="conv-manual-box">' +
              '<label for="manualEUR">1 EUR = ? TRY</label>' +
              '<input id="manualEUR" type="text" inputmode="decimal" enterkeyhint="done" ' +
                'value="' + (1 / ratesFromTRY.EUR).toFixed(2) + '" />' +
              '<label for="manualGBP">1 GBP = ? TRY</label>' +
              '<input id="manualGBP" type="text" inputmode="decimal" enterkeyhint="done" ' +
                'value="' + (1 / ratesFromTRY.GBP).toFixed(2) + '" />' +
            '</div>'
          : '');

      bindRowInputs();
      root.querySelector('#refreshBtn').addEventListener('click', fetchLiveRates);
      root.querySelector('#manualToggle').addEventListener('click', function () {
        manualOpen = !manualOpen;
        render();
      });
      if (manualOpen) bindManual();
    }

    loadCachedRates();
    render();
    updateOtherAmounts('TRY', amounts.TRY || '1000');
    updateStatus();
    fetchLiveRates();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && navigator.onLine) fetchLiveRates();
    });
    window.addEventListener('online', fetchLiveRates);
  }

  function startGoogleSignIn() {
    var le = document.getElementById('login-error');
    var provider = new firebase.auth.GoogleAuthProvider();
    fbAuth.signInWithPopup(provider).catch(function (err) {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
        fbAuth.signInWithRedirect(provider).catch(function (e2) {
          if (le) le.textContent = e2.message;
        });
      } else if (le) {
        le.textContent = err.message;
      }
    });
  }

  document.getElementById('btnSignIn').addEventListener('click', startGoogleSignIn);

  fbAuth.getRedirectResult().catch(function (err) {
    var le = document.getElementById('login-error');
    if (le && err && err.code && err.code !== 'auth/operation-not-supported-in-this-environment') {
      le.textContent = err.message;
    }
  });

  fbAuth.onAuthStateChanged(async function (user) {
    var le = document.getElementById('login-error');
    if (user) {
      if (!isAllowed(user.email)) {
        pendingDisallow = 'That Google account is not allowed.';
        fbAuth.signOut();
        return;
      }
      if (le) le.textContent = '';
      try {
        if (!tripReady) {
          showPhase('loading');
          var data = await loadTripData();
          if (data) renderTrip(data);
          else renderEmptyTrip();
          tripReady = true;
        }
        showPhase('app');
      } catch (err) {
        if (le) le.textContent = 'Could not load trip details. Check connection and try again.';
        showPhase('login');
      }
    } else {
      tripReady = false;
      converterStarted = false;
      document.getElementById('trip-root').innerHTML = '';
      document.getElementById('trip-app').classList.remove('is-ready');
      if (pendingDisallow && le) {
        le.textContent = pendingDisallow;
        pendingDisallow = '';
      } else if (le) {
        le.textContent = '';
      }
      showPhase('login');
    }
  });
})();
</script>
