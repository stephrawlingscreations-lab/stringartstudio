const SEASONS=[

  {name:"St. Patrick's Day",emoji:"☘️",date:"2026-03-17",leadWeeks:3,tip:"Green & gold themes. Great seller at Annacarty Tea Rooms around this time."},

  {name:"Communion Season",emoji:"✝️",date:"2026-05-02",leadWeeks:5,tip:"Huge in Ireland — white, gold and religious themes. Stock up well before May."},
  {name:"Father's Day",emoji:"👔",date:"2026-06-21",leadWeeks:4,tip:"Third Sunday in June in Ireland. Golf, GAA and humour themes always popular."},

  {name:"Easter",emoji:"🐣",date:"2027-04-05",leadWeeks:4,tip:"Pastel colours, bunnies, spring florals. Popular at the Tea Rooms."},
];
const SEED={
  customers:[
    {id:"CUST001",name:"Example Customer",phone:"08x xxx xxxx",email:"",town:"Your Town",source:"Facebook",prefs:"e.g. Loves florals, prefers pink tones",bday:""},
  ],
  inProgress:[
    {id:"ORD001",customerId:"CUST001",customerName:"Example Customer",cardType:"Birthday",dueDate:"",personalised:"No",designDone:false,made:false,notes:"Example order — delete me and add your real orders!",photo:null,channel:"Direct"},
  ],
  completed:[
    {id:"COMP001",customerId:"CUST001",customerName:"Example Customer",cardType:"Birthday",qty:1,total:5.00,payment:"Cash",completedDate:new Date().toISOString().slice(0,10),notes:"Example completed order",photo:null,channel:"Direct"},
  ],
  supplies:[
    {id:"SUP001",name:"Example — White card blanks A6",cat:"Card Blanks",qty:0,reorderAt:20,supplier:"",cost:0,notes:"Edit or delete me and add your own supplies!"},
  ],
  shopStock:[
    {id:"STK001",cardType:"Birthday",qty:0,price:0,notes:"Edit me — add your real card types and prices"},
  ],
  expenses:[
    {id:"EXP001",date:"2026-03-01",item:"Card blanks x50",cat:"Materials",amount:8.50,receipt:true,notes:""},
    {id:"EXP002",date:"2026-03-05",item:"Envelopes x100",cat:"Materials",amount:5.00,receipt:true,notes:""},
    {id:"EXP003",date:"2026-03-15",item:"Ribbon assorted",cat:"Materials",amount:4.20,receipt:false,notes:""},
    {id:"EXP004",date:"2026-04-01",item:"Postage stamps x10",cat:"Postage",amount:9.00,receipt:true,notes:""},
  ],
};

const load=(k,fb)=>{try{const v=localStorage.getItem("ppb_"+k);return v?JSON.parse(v):fb}catch{return fb}};
const saveLS=(k,v)=>{try{localStorage.setItem("ppb_"+k,JSON.stringify(v))}catch{}};
const saveFB=(uid,k,v)=>{if(!uid)return;fbDb.ref(`users/${uid}/${k}`).set(v).catch(()=>{})};
const loadFB=(uid)=>fbDb.ref(`users/${uid}`).once("value").then(s=>s.val()||{});
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const daysUntil=ds=>{const d=new Date(ds),n=new Date();n.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-n)/86400000)};

// ── UI Atoms ─────────────────────────────────────────────────────────────────
function Badge({children,color="pink",style:s={}}){
  const m={pink:[C.light,C.rose],green:[C.glight,C.green],gold:[C.gld,C.gold],blue:[C.blight,C.blue],grey:[C.lgrey,C.grey],teal:[C.tlight,C.teal],amber:["#fff3e0",C.amber]};
  const[bg,fg]=m[color]||m.pink;
  return<span style={{display:"inline-block",padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:.4,background:bg,color:fg,...s}}>{children}</span>;
}
function Btn({children,onClick,variant="primary",small,disabled,fullWidth,style:s={}}){
  const v={primary:{background:`linear-gradient(135deg,${C.mid},${C.rose})`,color:"#fff",border:"none"},secondary:{background:C.light,color:C.rose,border:`1.5px solid ${C.blush}`},ghost:{background:"transparent",color:C.rose,border:"1.5px solid #e0e0e0"},green:{background:`linear-gradient(135deg,#43a047,${C.green})`,color:"#fff",border:"none"},danger:{background:"#ffebee",color:"#c62828",border:"1.5px solid #ffcdd2"},amber:{background:`linear-gradient(135deg,${C.amber},${C.gold})`,color:"#fff",border:"none"},teal:{background:`linear-gradient(135deg,#26a69a,${C.teal})`,color:"#fff",border:"none"}}[variant]||{};
  return<button onClick={onClick} disabled={disabled} style={{...v,padding:small?"7px 15px":"11px 22px",borderRadius:10,fontSize:small?12:14,fontWeight:700,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,transition:"opacity .15s",width:fullWidth?"100%":"auto",letterSpacing:.3,...s}} onMouseEnter={e=>{if(!disabled)e.currentTarget.style.opacity=".82"}} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>{children}</button>;
}
const iSt={width:"100%",padding:"10px 14px",border:`1.5px solid ${C.blush}`,borderRadius:10,fontSize:14,color:C.text,background:"#fffafe",outline:"none",transition:"border-color .2s"};
function Lbl({text,req}){return<label style={{display:"block",fontSize:11,fontWeight:700,color:C.deep,marginBottom:5,letterSpacing:.6,textTransform:"uppercase"}}>{text}{req&&" *"}</label>}
function Inp({label,req,...p}){const extra=p.type==="number"?{inputMode:"decimal"}:{};return<div style={{marginBottom:13}}>{label&&<Lbl text={label} req={req}/>}<input style={iSt} {...extra} {...p} onFocus={e=>e.target.style.borderColor=C.rose} onBlur={e=>e.target.style.borderColor=C.blush}/></div>}
function Sel({label,req,options,labels,...p}){return<div style={{marginBottom:13}}>{label&&<Lbl text={label} req={req}/>}<select style={{...iSt,appearance:"none"}} {...p}><option value="">— select —</option>{options.map((o,i)=><option key={o} value={o}>{labels?labels[i]:o}</option>)}</select></div>}
function Txt({label,...p}){return<div style={{marginBottom:13}}>{label&&<Lbl text={label}/>}<textarea style={{...iSt,resize:"vertical",minHeight:58}} {...p} onFocus={e=>e.target.style.borderColor=C.rose} onBlur={e=>e.target.style.borderColor=C.blush}/></div>}
function Modal({open,onClose,children,wide}){if(!open)return null;return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={onClose}><div className="fade-in" onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,padding:28,maxWidth:wide?700:500,width:"100%",boxShadow:`0 24px 64px rgba(136,14,79,.22)`,maxHeight:"92vh",overflowY:"auto"}}>{children}</div></div>}
function MTitle({children,sub,onClose}){return<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}><div><h3 style={{margin:0,color:C.deep,fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:20}}>{children}</h3>{sub&&<p style={{margin:"4px 0 0",color:C.muted,fontSize:13}}>{sub}</p>}</div>{onClose&&<button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.muted,padding:4}}>✕</button>}</div>}
function PhotoUpload({value,onChange,size=80}){const ref=useRef();const handle=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const M=500,sc=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);onChange(cv.toDataURL("image/jpeg",.72));URL.revokeObjectURL(u)};img.src=u};return<div onClick={()=>ref.current.click()} style={{width:size,height:size,borderRadius:12,border:`2px dashed ${C.blush}`,background:C.light,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,transition:"border-color .2s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.rose} onMouseLeave={e=>e.currentTarget.style.borderColor=C.blush}><input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={handle}/>{value?<img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{textAlign:"center",color:C.blush,fontSize:11,lineHeight:1.5}}><div style={{fontSize:22,marginBottom:3}}>📷</div>Tap to add photo</div>}</div>}
function CheckPill({checked,onClick,label}){return<button onClick={onClick} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 14px",borderRadius:20,border:`1.5px solid ${checked?C.green:"#e0e0e0"}`,background:checked?C.glight:"#fafafa",cursor:"pointer",fontSize:12,fontWeight:700,color:checked?C.green:C.muted,fontFamily:"'Lato',sans-serif",transition:"all .2s"}}><span style={{fontSize:13}}>{checked?"✅":"⬜"}</span>{label}</button>}
function SecTitle({children,right}){return<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><h2 style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.deep,fontSize:20,letterSpacing:.3}}>{children}</h2>{right}</div>}
function Empty({icon,title,sub}){return<div style={{textAlign:"center",padding:"50px 20px",color:C.blush}}><div style={{fontSize:44,marginBottom:10}}>{icon}</div><div style={{fontWeight:700,color:C.rose,fontSize:15}}>{title}</div>{sub&&<div style={{fontSize:13,marginTop:6,color:C.muted}}>{sub}</div>}</div>}
function Card({children,style:s={}}){return<div style={{background:"#fff",borderRadius:16,border:`1.5px solid ${C.light}`,boxShadow:"0 2px 12px rgba(194,24,91,.06)",padding:18,...s}}>{children}</div>}

// ════════════════════════════════════════════════════════════════════════════
// APP ROOT
// ════════════════════════════════════════════════════════════════════════════
function App({user}){
  const[fbLoading,setFbLoading]=useState(true);
  const[customers,  setCR]=useState(()=>load("customers",  SEED.customers));
  const[inProgress, setIPR]=useState(()=>load("inProgress",SEED.inProgress));
  const[completed,  setCOR]=useState(()=>load("completed", SEED.completed));
  const[supplies,   setSR]=useState(()=>load("supplies",   SEED.supplies));
  const[shopStock,  setSSR]=useState(()=>load("shopStock", SEED.shopStock));
  const[expenses,   setER]=useState(()=>load("expenses",   SEED.expenses));
  const[tab,setTab]=useState("dashboard");
  const[toast,setToast]=useState({msg:"",color:C.green});
  const[modals,setModals]=useState({newOrder:false,newCustomer:false,complete:null,viewCard:null,viewCustomer:null,newExpense:false,newSupply:false,backup:false});

  useEffect(()=>{
    const defs={customers:SEED.customers,inProgress:SEED.inProgress,completed:SEED.completed,supplies:SEED.supplies,shopStock:SEED.shopStock,expenses:SEED.expenses};
    const setters={customers:setCR,inProgress:setIPR,completed:setCOR,supplies:setSR,shopStock:setSSR,expenses:setER};
    loadFB(user.uid).then(data=>{
      const hasCloud=Object.keys(data).length>0;
      Object.keys(defs).forEach(k=>{
        const val=hasCloud?(data[k]??defs[k]):load(k,defs[k]);
        setters[k](val);saveLS(k,val);
      });
      // First sign-in on a new device: push any existing localStorage data up to Firebase
      if(!hasCloud){
        const migrate={};
        Object.keys(defs).forEach(k=>migrate[k]=load(k,defs[k]));
        fbDb.ref(`users/${user.uid}`).set(migrate).catch(()=>{});
      }
      setFbLoading(false);
    }).catch(()=>setFbLoading(false));
  },[user.uid]);

  const openM=(k,v=true)=>setModals(m=>({...m,[k]:v}));
  const closeM=k=>setModals(m=>({...m,[k]:false}));
  const showT=(msg,color=C.green)=>{setToast({msg,color});setTimeout(()=>setToast({msg:"",color:C.green}),2200)};
  const mk=(set,key)=>fn=>set(prev=>{const next=typeof fn==="function"?fn(prev):fn;saveLS(key,next);saveFB(user.uid,key,next);return next});
  const setCustomers=useCallback(mk(setCR,"customers"),[]);
  const setInProgress=useCallback(mk(setIPR,"inProgress"),[]);
  const setCompleted=useCallback(mk(setCOR,"completed"),[]);
  const setSupplies=useCallback(mk(setSR,"supplies"),[]);
  const setShopStock=useCallback(mk(setSSR,"shopStock"),[]);
  const setExpenses=useCallback(mk(setER,"expenses"),[]);

  const finishOrder=useCallback((orderId,{photo,qty,total,payment,notes})=>{
    const order=inProgress.find(o=>o.id===orderId);if(!order)return;
    setCompleted(c=>[{id:order.id,customerId:order.customerId,customerName:order.customerName,cardType:order.cardType,qty:parseInt(qty)||1,total:parseFloat(total)||0,payment:payment||"Cash",completedDate:new Date().toISOString().slice(0,10),notes:notes||"",photo:photo||null,channel:"Direct"},...c]);
    setInProgress(p=>p.filter(o=>o.id!==orderId));closeM("complete");showT("✅ Order completed & saved!");
  },[inProgress]);
  const revenue=completed.reduce((s,o)=>s+o.total,0);
  const lowSupplies=supplies.filter(s=>s.qty<=s.reorderAt);
  const overdueOrders=inProgress.filter(o=>o.dueDate&&daysUntil(o.dueDate)<0);
  const TABS=[{key:"dashboard",label:"🏠 Home"},{key:"inprogress",label:"🔧 In Progress",badge:inProgress.length,bc:"rose"},{key:"shop",label:"🏪 Shop"},{key:"customers",label:"👥 Customers"},{key:"supplies",label:"📦 Supplies",badge:lowSupplies.length,bc:"amber"},{key:"money",label:"💰 Money"},{key:"seasons",label:"📅 Seasons"}];
  if(fbLoading)return<LoadingScreen/>;
  return<div style={{minHeight:"100vh",background:`linear-gradient(150deg,${C.light} 0%,${C.pale} 60%,${C.light} 100%)`}}>
    {/* HEADER */}
    <div style={{background:`linear-gradient(135deg,${C.deep} 0%,${C.rose} 55%,${C.mid} 100%)`,boxShadow:"0 4px 24px rgba(136,14,79,.3)"}}>
      <div style={{maxWidth:900,margin:"0 auto",padding:"18px 14px 0"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:16}}>
          <div>
            <h1 style={{color:"#fff",fontSize:24,fontFamily:"'Playfair Display',serif",fontWeight:700,margin:0}}>🌸 PPB Designs</h1>
            <p style={{color:"#f8bbd0",fontSize:11,margin:"3px 0 0",letterSpacing:.4}}>Handmade Cards · Annacarty Tea Rooms & Direct · Saves automatically</p>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <Btn onClick={()=>openM("newOrder")} small>+ New Order</Btn>
            <Btn onClick={()=>openM("newCustomer")} variant="secondary" small>+ Customer</Btn>
            <Btn onClick={()=>openM("backup")} variant="ghost" small style={{color:"#fff",border:"1.5px solid rgba(255,255,255,.6)"}}>💾 Backup</Btn>
            {user.photoURL
              ?<img src={user.photoURL} alt="" onClick={()=>fbAuth.signOut()} title="Sign out" style={{width:32,height:32,borderRadius:"50%",cursor:"pointer",border:"2px solid rgba(255,255,255,.5)",flexShrink:0}}/>
              :<div onClick={()=>fbAuth.signOut()} title="Sign out" style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,.2)",border:"2px solid rgba(255,255,255,.5)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>{(user.displayName||"?").charAt(0)}</div>}
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",background:"rgba(255,255,255,.11)",borderRadius:"10px 10px 0 0",overflow:"hidden"}}>
          {[{icon:"🔧",val:inProgress.length,label:"In Progress",warn:overdueOrders.length>0,t:"inprogress"},{icon:"💰",val:"€"+revenue.toFixed(0),label:"Revenue",t:"money"},{icon:"🏪",val:"€"+completed.filter(o=>o.channel==="Shop").reduce((s,o)=>s+o.total,0).toFixed(0),label:"Shop Sales",t:"shop"},{icon:"👥",val:customers.length,label:"Customers",t:"customers"},{icon:"📦",val:lowSupplies.length,label:"Need Reorder",warn:lowSupplies.length>0,t:"supplies"}].map(s=><div key={s.label} onClick={()=>setTab(s.t)} style={{textAlign:"center",padding:"11px 6px",borderRight:"1px solid rgba(255,255,255,.12)",cursor:"pointer",transition:"background .2s"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.09)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><div style={{fontSize:18}}>{s.icon}</div><div style={{color:s.warn?"#ffcc02":"#fff",fontWeight:700,fontSize:14,marginTop:1}}>{s.val}</div><div style={{color:"#f8bbd0",fontSize:10,letterSpacing:.4}}>{s.label}</div></div>)}
        </div>
      </div>
    </div>
    {/* TABS */}
    <div style={{background:"#fff",borderBottom:`2px solid ${C.light}`,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(194,24,91,.07)",overflowX:"auto"}}>
      <div style={{maxWidth:900,margin:"0 auto",display:"flex",minWidth:"max-content"}}>
        {TABS.map(t=><button key={t.key} onClick={()=>setTab(t.key)} style={{padding:"13px 14px",border:"none",background:"transparent",fontFamily:"'Lato',sans-serif",fontSize:12,fontWeight:tab===t.key?700:400,color:tab===t.key?C.rose:C.muted,borderBottom:tab===t.key?`3px solid ${C.rose}`:"3px solid transparent",cursor:"pointer",transition:"color .2s",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
          {t.label}{t.badge>0&&<span style={{background:t.bc==="amber"?C.amber:C.rose,color:"#fff",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>{t.badge}</span>}
        </button>)}
      </div>
    </div>
    {/* CONTENT */}
    <div style={{maxWidth:900,margin:"0 auto",padding:"22px 14px 70px"}}>
      {tab==="dashboard"&&<Dashboard inProgress={inProgress} completed={completed} customers={customers} shopStock={shopStock} lowSupplies={lowSupplies} overdueOrders={overdueOrders} setTab={setTab}/>}
      {tab==="inprogress"&&<InProgressTab inProgress={inProgress} setInProgress={setInProgress} onMarkComplete={o=>openM("complete",o)} showToast={showT}/>}
      {tab==="shop"&&<ShopTab shopStock={shopStock} setShopStock={setShopStock} completed={completed} setCompleted={setCompleted} showToast={showT}/>}
      {tab==="customers"&&<CustomersTab customers={customers} completed={completed} openModal={openM}/>}
      {tab==="supplies"&&<SuppliesTab supplies={supplies} setSupplies={setSupplies} openModal={openM} showToast={showT}/>}
      {tab==="money"&&<MoneyTab completed={completed} expenses={expenses} setExpenses={setExpenses} openModal={openM}/>}
      {tab==="seasons"&&<SeasonsTab/>}
    </div>
    {/* MODALS */}
    <Modal open={!!modals.complete} onClose={()=>closeM("complete")}>{modals.complete&&<CompleteOrderForm order={modals.complete} onSubmit={finishOrder} onCancel={()=>closeM("complete")}/>}</Modal>
    <Modal open={modals.newOrder} onClose={()=>closeM("newOrder")}><NewOrderForm customers={customers} onSubmit={o=>{setInProgress(p=>[...p,o]);closeM("newOrder");showT("Order added!")}} onCancel={()=>closeM("newOrder")}/></Modal>
    <Modal open={modals.newCustomer} onClose={()=>closeM("newCustomer")}><NewCustomerForm onSubmit={c=>{setCustomers(cs=>[...cs,c]);closeM("newCustomer");showT("Customer added!")}} onCancel={()=>closeM("newCustomer")}/></Modal>
    <Modal open={!!modals.viewCustomer} onClose={()=>closeM("viewCustomer")} wide>{modals.viewCustomer&&<CustomerDetail customer={modals.viewCustomer} completed={completed} setCustomers={setCustomers} setCompleted={setCompleted} onClose={()=>closeM("viewCustomer")} showToast={showT}/>}</Modal>
    <Modal open={modals.newExpense} onClose={()=>closeM("newExpense")}><NewExpenseForm onSubmit={e=>{setExpenses(ex=>[e,...ex]);closeM("newExpense");showT("Expense saved!")}} onCancel={()=>closeM("newExpense")}/></Modal>
    <Modal open={modals.newSupply} onClose={()=>closeM("newSupply")}><NewSupplyForm onSubmit={s=>{setSupplies(sp=>[...sp,s]);closeM("newSupply");showT("Supply added!")}} onCancel={()=>closeM("newSupply")}/></Modal>
    <Modal open={modals.backup} onClose={()=>closeM("backup")}>
      <BackupModal customers={customers} inProgress={inProgress} completed={completed} supplies={supplies} shopStock={shopStock} expenses={expenses} onImport={(data)=>{
        if(data.customers){setCustomers(data.customers);}
        if(data.inProgress){setInProgress(data.inProgress);}
        if(data.completed){setCompleted(data.completed);}
        if(data.supplies){setSupplies(data.supplies);}
        if(data.shopStock){setShopStock(data.shopStock);}
        if(data.expenses){setExpenses(data.expenses);}
        closeM("backup");showT("✅ Data restored successfully!");
      }} onClose={()=>closeM("backup")}/>
    </Modal>
    {toast.msg&&<div className="toast" style={{background:toast.color}}>{toast.msg}</div>}
  </div>;
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({inProgress,completed,customers,shopStock,lowSupplies,overdueOrders,setTab}){
  const upcoming=SEASONS.map(s=>({...s,days:daysUntil(s.date)})).filter(s=>s.days>=0).sort((a,b)=>a.days-b.days).slice(0,3);
  const m=new Date().getMonth(),yr=new Date().getFullYear();
  const monthRev=completed.filter(o=>{const d=new Date(o.completedDate);return d.getMonth()===m&&d.getFullYear()===yr}).reduce((s,o)=>s+o.total,0);
  const dueWeek=inProgress.filter(o=>{if(!o.dueDate)return false;const d=daysUntil(o.dueDate);return d>=0&&d<=7});
  return<div className="fade-in">
    <SecTitle>Good {new Date().getHours()<12?"morning":"afternoon"}! 🌸</SecTitle>
    {(overdueOrders.length>0||lowSupplies.length>0)&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
      {overdueOrders.length>0&&<div style={{background:"#ffebee",border:"1.5px solid #ffcdd2",borderRadius:12,padding:"12px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}} onClick={()=>setTab("inprogress")}><span style={{fontSize:20}}>⚠️</span><div><strong style={{color:"#c62828"}}>Overdue: </strong><span style={{color:"#c62828",fontSize:13}}>{overdueOrders.map(o=>o.customerName).join(", ")}</span></div></div>}
      {lowSupplies.length>0&&<div style={{background:"#fff3e0",border:"1.5px solid #ffe0b2",borderRadius:12,padding:"12px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}} onClick={()=>setTab("supplies")}><span style={{fontSize:20}}>📦</span><div><strong style={{color:C.amber}}>Low stock: </strong><span style={{color:C.amber,fontSize:13}}>{lowSupplies.map(s=>s.name).join(", ")}</span></div></div>}
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:20}}>
      {[{label:"This Month",val:"€"+monthRev.toFixed(2),icon:"💰",color:C.rose,bg:C.light,t:"money"},{label:"Due This Week",val:dueWeek.length+" orders",icon:"📋",color:C.blue,bg:C.blight,t:"inprogress"},{label:"Shop Cards Left",val:shopStock.reduce((s,i)=>s+i.qty,0)+" cards",icon:"🏪",color:C.teal,bg:C.tlight,t:"shop"},{label:"Repeat Customers",val:customers.filter(c=>completed.filter(o=>o.customerId===c.id).length>1).length,icon:"💕",color:C.green,bg:C.glight,t:"customers"}].map(k=><div key={k.label} onClick={()=>setTab(k.t)} style={{background:k.bg,borderRadius:14,padding:"16px",cursor:"pointer",transition:"transform .15s,box-shadow .15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 6px 20px rgba(0,0,0,.1)"}} onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none"}}><div style={{fontSize:24,marginBottom:6}}>{k.icon}</div><div style={{fontWeight:900,fontSize:20,color:k.color,fontFamily:"'Playfair Display',serif"}}>{k.val}</div><div style={{fontSize:11,color:C.muted,marginTop:2,fontWeight:700,letterSpacing:.4,textTransform:"uppercase"}}>{k.label}</div></div>)}
    </div>
    <Card style={{marginBottom:20}}>
      <div style={{fontWeight:700,color:C.deep,fontSize:13,letterSpacing:.5,textTransform:"uppercase",marginBottom:14}}>📅 Coming Up — Plan Ahead</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {upcoming.map(s=>{const urgent=s.days<=s.leadWeeks*7;return<div key={s.name} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderRadius:12,background:urgent?C.light:C.lgrey,border:`1.5px solid ${urgent?C.blush:"#e0e0e0"}`}}><span style={{fontSize:26,flexShrink:0}}>{s.emoji}</span><div style={{flex:1}}><div style={{fontWeight:700,color:urgent?C.rose:C.text,fontSize:14}}>{s.name}</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>{s.tip}</div></div><div style={{textAlign:"right",flexShrink:0}}><div style={{fontWeight:700,color:urgent?C.rose:C.grey,fontSize:13}}>{s.days}d</div>{urgent&&<div className="pulse" style={{fontSize:10,color:C.rose,fontWeight:700}}>START NOW</div>}</div></div>})}
      </div>
    </Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Card>
        <div style={{fontWeight:700,color:C.blue,fontSize:12,letterSpacing:.5,textTransform:"uppercase",marginBottom:12}}>🔧 In Progress</div>
        {inProgress.length===0
          ?<div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:12}}>No active orders</div>
          :inProgress.slice(0,5).map(o=><div key={o.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${C.light}`}}>
            <div style={{width:34,height:34,borderRadius:8,background:C.blight,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🔧</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:12,color:C.deep,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.customerName}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:1}}>{o.cardType}</div>
              {o.dueDate&&<div style={{fontSize:10,color:daysUntil(o.dueDate)<0?C.rose:C.muted,marginTop:1,fontWeight:daysUntil(o.dueDate)<0?700:400}}>Due {new Date(o.dueDate).toLocaleDateString("en-IE")}</div>}
            </div>
            {o.personalised==="Yes"&&<Badge color="gold" style={{fontSize:9,padding:"1px 6px"}}>P</Badge>}

        {completed.length===0
          ?<div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:12}}>No completed orders yet</div>
          :completed.slice(0,5).map(o=><div key={o.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${C.light}`}}>
            <div style={{width:34,height:34,borderRadius:8,background:C.light,overflow:"hidden",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>
              {o.photo?<img src={o.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"🌸"}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:12,color:C.deep,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.customerName}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:1}}>{o.cardType}</div>
              <div style={{fontSize:10,color:C.muted,marginTop:1}}>{new Date(o.completedDate).toLocaleDateString("en-IE")}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontWeight:700,color:C.rose,fontSize:12}}>€{o.total.toFixed(2)}</div>
              <Badge color={o.channel==="Shop"?"teal":"green"} style={{fontSize:9,padding:"1px 6px"}}>{o.channel==="Shop"?"Shop":"Direct"}</Badge>
            </div>
          </div>)}
      </Card>
    </div>
  </div>;
}

// ── In Progress Tab ───────────────────────────────────────────────────────────
function InProgressTab({inProgress,setInProgress,onMarkComplete,showToast}){
  const[editOrder,setEditOrder]=useState(null);
  const overdue=inProgress.filter(o=>o.dueDate&&daysUntil(o.dueDate)<0);
  const soon=inProgress.filter(o=>{if(!o.dueDate)return false;const d=daysUntil(o.dueDate);return d>=0&&d<=7});
  const rest=inProgress.filter(o=>!o.dueDate||(daysUntil(o.dueDate)>7));
  const toggle=(id,field)=>setInProgress(p=>p.map(o=>o.id===id?{...o,[field]:!o[field]}:o));
  const setPhoto=(id,photo)=>{setInProgress(p=>p.map(o=>o.id===id?{...o,photo}:o));showToast("Photo saved!")};
  const deleteOrder=(id)=>{setInProgress(p=>p.filter(o=>o.id!==id));showToast("Order deleted");};
  const saveOrder=(id,changes)=>{setInProgress(p=>p.map(o=>o.id===id?{...o,...changes}:o));setEditOrder(null);showToast("Order updated!");};
  const Sec=({title,items,tc})=>items.length===0?null:<><div style={{fontSize:11,fontWeight:700,color:tc,letterSpacing:.6,textTransform:"uppercase",marginBottom:8,marginTop:16}}>{title}</div>{items.map(o=><IPCard key={o.id} order={o} onToggleDesign={()=>toggle(o.id,"designDone")} onToggleMade={()=>toggle(o.id,"made")} onUpdatePhoto={p=>setPhoto(o.id,p)} onMarkComplete={()=>onMarkComplete(o)} onEdit={()=>setEditOrder(o)} onDelete={()=>deleteOrder(o.id)}/>)}</>;
  return<div className="fade-in">
    <SecTitle>In Progress</SecTitle>
    {inProgress.length===0?<Empty icon="🎉" title="All caught up!" sub="No orders in progress right now."/>:<><Sec title="⚠️ Overdue" items={overdue} tc="#c62828"/><Sec title="📅 Due This Week" items={soon} tc={C.amber}/><Sec title="🔧 Other Orders" items={rest} tc={C.rose}/></>}
    <Modal open={!!editOrder} onClose={()=>setEditOrder(null)}>
      {editOrder&&<EditIPOrderForm order={editOrder} onSave={(changes)=>saveOrder(editOrder.id,changes)} onCancel={()=>setEditOrder(null)}/>}
    </Modal>
  </div>;
}
function IPCard({order,onToggleDesign,onToggleMade,onUpdatePhoto,onMarkComplete,onEdit,onDelete}){
  const days=order.dueDate?daysUntil(order.dueDate):null;
  const overdue=days!==null&&days<0,soon=days!==null&&days>=0&&days<=3,both=order.designDone&&order.made;
  return<div className="fade-in" style={{background:"#fff",borderRadius:16,border:`2px solid ${overdue?C.blush:soon?"#ffe0b2":C.light}`,padding:16,display:"flex",gap:14,alignItems:"flex-start",boxShadow:"0 2px 12px rgba(194,24,91,.06)",marginBottom:12}}>
    <PhotoUpload value={order.photo} onChange={onUpdatePhoto} size={72}/>
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:6}}>
        <div><div style={{fontWeight:700,fontSize:15,color:C.deep,fontFamily:"'Playfair Display',serif"}}>{order.customerName}</div><div style={{fontSize:12,color:C.muted,marginTop:1}}>{order.cardType}{order.personalised==="Yes"?" · Personalised":""}</div></div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
          {overdue&&<Badge color="pink">⚠️ Overdue {Math.abs(days)}d</Badge>}
          {soon&&!overdue&&<Badge color="amber">Due soon</Badge>}
          {order.dueDate&&!overdue&&!soon&&<span style={{fontSize:11,color:C.muted}}>Due {new Date(order.dueDate).toLocaleDateString("en-IE")}</span>}
        </div>
      </div>
      {order.notes&&<div style={{marginTop:7,fontSize:13,color:C.grey,fontStyle:"italic"}}>📝 {order.notes}</div>}
      <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}><CheckPill checked={order.designDone} onClick={onToggleDesign} label="Design done"/><CheckPill checked={order.made} onClick={onToggleMade} label="Card made"/></div>
      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
        <Btn onClick={onMarkComplete} variant={both?"green":"ghost"} small>{both?"✅ Mark Complete & Deliver":"Mark Complete"}</Btn>
        <button onClick={onEdit} style={{fontSize:11,padding:"5px 12px",borderRadius:8,border:`1px solid ${C.blush}`,background:"#fff",color:C.rose,cursor:"pointer",fontFamily:"Lato,sans-serif"}}>Edit</button>
        <button onClick={onDelete} style={{fontSize:11,padding:"5px 12px",borderRadius:8,border:"1px solid #ffcdd2",background:"#ffebee",color:"#c62828",cursor:"pointer",fontFamily:"Lato,sans-serif"}}>Delete</button>
      </div>
    </div>
  </div>;
}
function EditIPOrderForm({order,onSave,onCancel}){
  const[f,setF]=useState({cardType:order.cardType,dueDate:order.dueDate||"",personalised:order.personalised||"No",notes:order.notes||""});
  const sf=(k,v)=>setF(x=>({...x,[k]:v}));
  return<div>
    <MTitle sub={order.customerName}>Edit Order</MTitle>
    <Sel label="Card Type" req options={CARD_TYPES} value={f.cardType} onChange={e=>sf("cardType",e.target.value)}/>
    <Inp label="Due Date" type="date" value={f.dueDate} onChange={e=>sf("dueDate",e.target.value)}/>
    <Sel label="Personalised?" options={["Yes","No"]} value={f.personalised} onChange={e=>sf("personalised",e.target.value)}/>
    <Txt label="Notes" value={f.notes} onChange={e=>sf("notes",e.target.value)} placeholder="Any special requests…"/>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <Btn onClick={onCancel} variant="ghost" small>Cancel</Btn>
      <Btn onClick={()=>f.cardType&&onSave(f)} variant="primary" small disabled={!f.cardType}>Save</Btn>
    </div>

}

// ── Shop Tab ────────────────────────────────────────────────────────────────────
function ShopTab({shopStock,setShopStock,completed,setCompleted,showToast}){
  const shopSales=completed.filter(o=>o.channel==="Shop");
  const shopRev=shopSales.reduce((s,o)=>s+o.total,0);
  const[addModal,setAddModal]=useState(false);
  const[filter,setFilter]=useState("All");

  const toggleSold=(id)=>{
    const item=shopStock.find(i=>i.id===id);
    if(!item)return;
    const nowSold=!item.sold;
    if(nowSold){
      const saleId="SHOP"+genId();
      setShopStock(s=>s.map(i=>i.id===id?{...i,sold:true,soldDate:new Date().toISOString().slice(0,10),saleId}:i));
      setCompleted(c=>[{id:saleId,customerId:"",customerName:"Annacarty Tea Rooms",cardType:item.cardType,qty:1,total:item.price||0,payment:"Cash",completedDate:new Date().toISOString().slice(0,10),notes:item.notes||"",photo:item.photo||null,channel:"Shop"},...c]);
      showToast("✅ Marked as sold & revenue recorded!");
    }else{
      setCompleted(c=>c.filter(o=>o.id!==item.saleId));
      setShopStock(s=>s.map(i=>i.id===id?{...i,sold:false,soldDate:null,saleId:null}:i));
      showToast("↩️ Marked as unsold — revenue reversed");
    }
  };

  const addDesign=(design)=>{
    setShopStock(s=>[{id:"STK"+genId(),...design,sold:false,soldDate:null,dateAdded:new Date().toISOString().slice(0,10)},...s]);
    setAddModal(false);showToast("Design added to shop!");
  };

  const unsold=shopStock.filter(i=>!i.sold);
  const sold=shopStock.filter(i=>i.sold);
  const allTypes=["All",...new Set(shopStock.map(i=>i.cardType))];

  const filterItems=(items)=>filter==="All"?items:items.filter(i=>i.cardType===filter);

  return<div className="fade-in">
    <SecTitle right={<Btn onClick={()=>setAddModal(true)} small variant="teal">+ Add Design to Shop</Btn>}>🏪 Annacarty Tea Rooms</SecTitle>

    {/* Stats */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:20}}>
      {[
        {label:"In Shop",val:unsold.length,bg:C.tlight,color:C.teal},
        {label:"Sold",val:sold.length,bg:C.glight,color:C.green},
        {label:"Shop Revenue",val:"€"+shopRev.toFixed(2),bg:C.light,color:C.rose},
        {label:"Best Seller",val:shopSales.length>0?Object.entries(shopSales.reduce((a,o)=>{a[o.cardType]=(a[o.cardType]||0)+1;return a},{})).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—":"—",bg:C.gld,color:C.gold},
      ].map(k=><div key={k.label} style={{background:k.bg,borderRadius:12,padding:"12px 10px",textAlign:"center"}}>
        <div style={{fontWeight:900,fontSize:16,color:k.color,fontFamily:"Playfair Display,serif"}}>{k.val}</div>
        <div style={{fontSize:10,color:C.muted,marginTop:2,fontWeight:700,letterSpacing:.4,textTransform:"uppercase"}}>{k.label}</div>
      </div>)}
    </div>

    {/* Filter bar */}
    {shopStock.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
      {allTypes.map(t=><button key={t} onClick={()=>setFilter(t)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${filter===t?C.teal:"#e0e0e0"}`,background:filter===t?C.tlight:"#fff",color:filter===t?C.teal:C.muted,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Lato,sans-serif"}}>{t}</button>)}
    </div>}

    {/* In Shop — unsold */}
    <div style={{marginBottom:24}}>
      <div style={{fontSize:11,fontWeight:700,color:C.teal,letterSpacing:.6,textTransform:"uppercase",marginBottom:10}}>Currently In Shop ({filterItems(unsold).length})</div>
      {filterItems(unsold).length===0
        ?<div style={{textAlign:"center",padding:"30px",color:C.muted,fontSize:13,background:"#fff",borderRadius:14,border:`1.5px dashed ${C.blush}`}}>No designs in shop yet — tap <strong>+ Add Design to Shop</strong> above</div>
        :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12}}>
          {filterItems(unsold).map(item=><DesignCard key={item.id} item={item} onToggleSold={()=>toggleSold(item.id)} onRemove={()=>{setShopStock(s=>s.filter(i=>i.id!==item.id));showToast("Removed from shop")}}/>)}
        </div>}
    </div>

    {/* Sold designs */}
    {filterItems(sold).length>0&&<div>
      <div style={{fontSize:11,fontWeight:700,color:C.green,letterSpacing:.6,textTransform:"uppercase",marginBottom:10}}>Sold Designs ({filterItems(sold).length})</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12}}>
        {filterItems(sold).map(item=><DesignCard key={item.id} item={item} onToggleSold={()=>toggleSold(item.id)}/>)}
      </div>
    </div>}

    <Modal open={addModal} onClose={()=>setAddModal(false)}>
      <AddDesignForm onSubmit={addDesign} onCancel={()=>setAddModal(false)}/>
    </Modal>
  </div>;
}

  return<div style={{background:"#fff",borderRadius:14,border:`2px solid ${item.sold?C.glight:C.light}`,overflow:"hidden",boxShadow:"0 2px 10px rgba(194,24,91,.07)",opacity:item.sold?.8:1,transition:"all .2s"}}>
    {/* Photo */}
    <div style={{width:"100%",height:130,background:item.sold?C.glight:C.light,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",position:"relative"}}>
      {item.photo
        ?<img src={item.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        :<span style={{fontSize:36}}>🌸</span>}
      {item.sold&&<div style={{position:"absolute",inset:0,background:"rgba(46,125,50,.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:32}}>✅</span></div>}
    </div>
    {/* Info */}
    <div style={{padding:"10px 12px"}}>
      <div style={{fontWeight:700,fontSize:13,color:item.sold?C.green:C.deep}}>{item.cardType}</div>

      {item.notes&&<div style={{fontSize:11,color:C.muted,marginTop:2,lineHeight:1.3}}>{item.notes}</div>}
      <div style={{fontSize:10,color:C.muted,marginTop:3}}>{item.sold?`Sold ${item.soldDate?new Date(item.soldDate).toLocaleDateString("en-IE"):""}`:item.dateAdded?`Added ${new Date(item.dateAdded).toLocaleDateString("en-IE")}`:""}</div>
      {/* Tick sold button */}
      <button onClick={onToggleSold} style={{marginTop:8,width:"100%",padding:"6px",borderRadius:8,border:`1.5px solid ${item.sold?C.green:C.blush}`,background:item.sold?C.glight:C.light,color:item.sold?C.green:C.rose,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"Lato,sans-serif",transition:"all .2s"}}>
        {item.sold?"↩️ Mark Unsold":"✅ Mark as Sold"}
      </button>
      {onRemove&&!item.sold&&<button onClick={onRemove} style={{marginTop:4,width:"100%",padding:"4px",borderRadius:8,border:"none",background:"transparent",color:C.muted,fontSize:10,cursor:"pointer",fontFamily:"Lato,sans-serif"}}>Remove</button>}
    </div>
  </div>;
}

function AddDesignForm({onSubmit,onCancel}){
  const[f,setF]=useState({cardType:"",price:"",notes:"",photo:null});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return<div>
    <MTitle>Add Design to Shop</MTitle>
    <div style={{marginBottom:14}}>

function CompleteOrderForm({order,onSubmit,onCancel}){

  return<div><MTitle sub={`${order.customerName} · ${order.cardType}`}>Complete Order</MTitle><div style={{display:"flex",gap:16,marginBottom:14,alignItems:"flex-start"}}><div><label style={{display:"block",fontSize:11,fontWeight:700,color:C.deep,marginBottom:6,letterSpacing:.6,textTransform:"uppercase"}}>Card Photo</label><PhotoUpload value={photo} onChange={setPhoto} size={96}/><div style={{fontSize:10,color:C.muted,marginTop:4,textAlign:"center"}}>optional</div></div><div style={{flex:1}}><Inp label="Qty" type="number" min={1} value={qty} onChange={e=>setQty(e.target.value)}/><Inp label="Total charged (€)" req type="number" step="0.01" placeholder="0.00" value={total} onChange={e=>setTotal(e.target.value)}/><Sel label="Payment" options={PAYMENT} value={payment} onChange={e=>setPayment(e.target.value)}/></div></div><Txt label="Notes" value={notes} onChange={e=>setNotes(e.target.value)}/><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn onClick={onCancel} variant="ghost" small>Cancel</Btn><Btn onClick={()=>total&&onSubmit(order.id,{photo,qty,total,payment,notes})} variant="green" small disabled={!total}>✅ Complete & Save</Btn></div></div>;
}
function NewOrderForm({customers,onSubmit,onCancel}){
  const[f,setF]=useState({customerId:"",cardType:"",dueDate:"",personalised:"No",notes:""});const s=(k,v)=>setF(x=>({...x,[k]:v}));const cust=customers.find(c=>c.id===f.customerId);
  return<div><MTitle>New Order</MTitle><Sel label="Customer" req options={customers.map(c=>c.id)} labels={customers.map(c=>c.name)} value={f.customerId} onChange={e=>s("customerId",e.target.value)}/>{cust&&<div style={{marginTop:-8,marginBottom:12,fontSize:12,color:C.muted,paddingLeft:4}}>👤 {cust.name} · {cust.town}{cust.prefs&&<span style={{color:C.rose}}> · 💕 {cust.prefs}</span>}</div>}<Sel label="Card Type" req options={CARD_TYPES} value={f.cardType} onChange={e=>s("cardType",e.target.value)}/><Inp label="Due Date" type="date" value={f.dueDate} onChange={e=>s("dueDate",e.target.value)}/><Sel label="Personalised?" options={["Yes","No"]} value={f.personalised} onChange={e=>s("personalised",e.target.value)}/><Txt label="Notes" value={f.notes} onChange={e=>s("notes",e.target.value)} placeholder="Any special requests…"/><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn onClick={onCancel} variant="ghost" small>Cancel</Btn><Btn onClick={()=>f.customerId&&f.cardType&&onSubmit({id:"ORD"+genId(),...f,customerName:cust.name,designDone:false,made:false,photo:null,channel:"Direct"})} variant="primary" small disabled={!f.customerId||!f.cardType}>Add Order</Btn></div></div>;
}
function NewCustomerForm({onSubmit,onCancel}){
  const[f,setF]=useState({name:"",phone:"",email:"",town:"",source:"",prefs:"",bday:""});const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return<div><MTitle>New Customer</MTitle><Inp label="Full Name" req value={f.name} onChange={e=>s("name",e.target.value)} placeholder="e.g. Áine Ryan"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Phone" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="08x xxx xxxx"/><Inp label="Town" value={f.town} onChange={e=>s("town",e.target.value)}/></div><Inp label="Email" type="email" value={f.email} onChange={e=>s("email",e.target.value)}/><Sel label="How did they find PPB?" options={SOURCES} value={f.source} onChange={e=>s("source",e.target.value)}/><Txt label="Preferences (what do they like?)" value={f.prefs} onChange={e=>s("prefs",e.target.value)} placeholder="e.g. Loves florals, always wants personalised, prefers kraft card…"/><Inp label="Birthday month (optional)" value={f.bday} onChange={e=>s("bday",e.target.value)} placeholder="e.g. July"/><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn onClick={onCancel} variant="ghost" small>Cancel</Btn><Btn onClick={()=>f.name.trim()&&onSubmit({id:"CUST"+genId(),...f,name:f.name.trim()})} variant="primary" small disabled={!f.name.trim()}>Add Customer</Btn></div></div>;
}

// ── Backup & Restore ─────────────────────────────────────────────────────────
function BackupModal({customers,inProgress,completed,supplies,shopStock,expenses,onImport,onClose}){
  const[importError,setImportError]=useState("");
  const[imported,setImported]=useState(false);
  const fileRef=useRef();

  const exportData=()=>{
    const data={
      exportDate:new Date().toISOString(),
      version:"1.0",
      customers,inProgress,completed,supplies,shopStock,expenses
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const dateStr=new Date().toLocaleDateString("en-IE").replace(/\//g,"-");
    a.href=url;
    a.download=`PPBDesigns-backup-${dateStr}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.customers&&!data.completed){
          setImportError("This doesn't look like a PPB Designs backup file.");
          return;
        }
        setImportError("");
        setImported(true);
        onImport(data);
      }catch{
        setImportError("Couldn't read that file — make sure it's a PPB Designs backup.");
      }
    };
    reader.readAsText(file);
  };

  const stats=[
    {label:"Customers",val:customers.length,icon:"👥"},
    {label:"In Progress",val:inProgress.length,icon:"🔧"},
    {label:"Completed Orders",val:completed.length,icon:"✅"},
    {label:"Supplies",val:supplies.length,icon:"📦"},
    {label:"Shop Designs",val:shopStock.length,icon:"🏪"},
    {label:"Expenses",val:expenses.length,icon:"💸"},
  ];

  return<div>
    <MTitle onClose={onClose}>💾 Backup & Restore</MTitle>

    {/* Current data summary */}
    <div style={{background:C.pale,borderRadius:12,padding:14,marginBottom:20}}>
      <div style={{fontSize:11,fontWeight:700,color:C.deep,letterSpacing:.6,textTransform:"uppercase",marginBottom:10}}>What will be backed up</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {stats.map(s=><div key={s.label} style={{textAlign:"center",background:"#fff",borderRadius:10,padding:"8px 4px"}}>
          <div style={{fontSize:18}}>{s.icon}</div>
          <div style={{fontWeight:700,color:C.rose,fontSize:14}}>{s.val}</div>
          <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:.3}}>{s.label}</div>
        </div>)}
      </div>
    </div>

    {/* Export */}
    <div style={{marginBottom:20}}>
      <div style={{fontSize:13,fontWeight:700,color:C.deep,marginBottom:6}}>📤 Export — Save a backup</div>
      <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.5}}>Downloads a backup file with all your data. Save it to iCloud Drive, Google Drive, or email it to yourself. Do this regularly!</p>
      <Btn onClick={exportData} variant="primary" fullWidth>Download Backup File</Btn>
    </div>

    <div style={{height:1,background:C.light,marginBottom:20}}/>

    {/* Import */}
    <div>
      <div style={{fontSize:13,fontWeight:700,color:C.deep,marginBottom:6}}>📥 Restore — Load a backup</div>
      <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.5}}>Choose a previously saved backup file to restore your data. <strong style={{color:C.rose}}>This will replace your current data</strong> so only use a backup file you trust.</p>
      <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
      <Btn onClick={()=>fileRef.current.click()} variant="ghost" fullWidth>Choose Backup File to Restore</Btn>
      {importError&&<div style={{marginTop:8,padding:"8px 12px",background:"#ffebee",borderRadius:8,fontSize:12,color:"#c62828"}}>{importError}</div>}
      {imported&&<div style={{marginTop:8,padding:"8px 12px",background:C.glight,borderRadius:8,fontSize:12,color:C.green,fontWeight:700}}>✅ Data restored successfully!</div>}
    </div>

    <div style={{marginTop:16,padding:"10px 14px",background:C.glight,borderRadius:10,fontSize:12,color:C.green,border:`1.5px solid #a5d6a7`}}>
      ☁️ <strong>Auto-sync is on.</strong> Your data saves to the cloud automatically. Sign in on any device or browser to access it.
    </div>
    <div style={{marginTop:10,padding:"10px 14px",background:C.gld,borderRadius:10,fontSize:12,color:C.gold}}>
      💡 <strong>Tip:</strong> The Download Backup button is still useful as an extra safety net — save one to iCloud Drive every now and then.
    </div>
  </div>;
}

// ── Loading & Sign-In screens ─────────────────────────────────────────────────
function LoadingScreen(){
  return<div style={{minHeight:"100vh",background:`linear-gradient(135deg,${C.deep} 0%,${C.rose} 60%,${C.mid} 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
    <div style={{fontSize:52}}>🌸</div>
    <div style={{color:"#fff",fontWeight:700,fontSize:16,fontFamily:"'Playfair Display',serif"}}>Loading PPB Designs…</div>
  </div>;
}

function SignInScreen(){
  const[err,setErr]=useState("");
  const signIn=async()=>{
    setErr("");
    try{
      const p=new firebase.auth.GoogleAuthProvider();
      await fbAuth.signInWithPopup(p);
    }catch(e){
      if(e.code==="auth/popup-blocked"){
        // Safari blocked the popup — fall back to redirect
        fbAuth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      }else{
        setErr("Sign-in failed — please try again. ("+e.code+")");
      }
    }
  };
  return<div style={{minHeight:"100vh",background:`linear-gradient(135deg,${C.deep} 0%,${C.rose} 60%,${C.mid} 100%)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"rgba(255,255,255,.12)",borderRadius:28,padding:"40px 32px",maxWidth:320,width:"100%",textAlign:"center",backdropFilter:"blur(10px)"}}>
      <div style={{fontSize:48,marginBottom:8}}>🌸</div>
      <h1 style={{color:"#fff",fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,margin:"0 0 8px"}}>PPB Designs</h1>
      <p style={{color:"#f8bbd0",fontSize:13,margin:"0 0 32px",lineHeight:1.5}}>Sign in with your Google account to access your business tracker</p>
      <button onClick={signIn} style={{width:"100%",padding:"14px",borderRadius:14,border:"2px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.15)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"'Lato',sans-serif",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
        <svg width="18" height="18" viewBox="0 0 24 24" style={{flexShrink:0}}><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
      {err&&<p style={{color:"#ffcdd2",fontSize:13,marginTop:14,fontWeight:700}}>{err}</p>}
    </div>
    <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-8px)}80%{transform:translateX(4px)}}`}</style>
  </div>;
}

function Root(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);
  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{setUser(u);setChecking(false)});
    return()=>unsub();
  },[]);
  if(checking)return<LoadingScreen/>;
  if(!user)return<SignInScreen/>;
  return<App user={user}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
