<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steph String Art Studio</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }

    header {
      padding: 14px;
      border-bottom: 1px solid #e8e8e8;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
    }

    .tagline {
      margin: 4px 0 0;
      font-size: 12px;
      color: #666;
    }

    .wrap {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .panel h2 {
      font-size: 14px;
      margin: 8px 0 10px;
    }

    label {
      font-size: 12px;
      color: #333;
      display: block;
      margin: 8px 0 4px;
    }

    input,
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #cfcfcf;
      border-radius: 12px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="color"] {
      padding: 0;
      height: 40px;
    }

    button {
      padding: 10px 12px;
      border: 1px solid #cfcfcf;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f6f6f6;
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    /* Canvas */
    canvas {
      width: 100%;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fff;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      line-height: 1.4;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
    }

    .q {
      display: inline-block;
      margin-left: 6px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.25);
      line-height: 18px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .zoomRow {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .zoomBtn {
      width: 36px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #cfcfcf;
      background: #fff;
      font-size: 18px;
      padding: 0;
    }

    /* =========================
       MOBILE LAYOUT
    ========================== */

    @media (max-width: 980px) {
      .wrap {
        grid-template-columns: 1fr;
      }

      /* Controls first */
      .panel {
        order: 1;
      }

      /* Sticky canvas */
      canvas {
        order: 2;
        position: sticky;
        top: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Interactive String Art Board Designer</h1>
  <p class="tagline">Create precise, print-ready numbered layouts in seconds</p>
</header>

<div class="wrap">

  <div class="panel">

    <h2>Board</h2>

    <div class="row">
      <div>
        <label>Shape</label>
        <select id="board">
          <option value="circle" selected>Circle</option>
          <option value="square">Square</option>
        </select>
      </div>

      <div>
        <label>Nails</label>
        <input id="nails" type="number" value="150" min="10" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>
          Zoom
          <span class="q" data-tip="Changes preview size only.">?</span>
        </label>
        <div class="zoomRow">
          <button id="zoomOut" class="zoomBtn">−</button>
          <input id="radius" type="number" value="320" min="80" step="10" />
          <button id="zoomIn" class="zoomBtn">+</button>
        </div>
      </div>

      <div>
        <label>
          Selection sensitivity
          <span class="q" data-tip="How close you must tap to select a nail.">?</span>
        </label>
        <input id="snap" type="number" value="18" min="6" />
      </div>
    </div>

    <div class="row3">
      <div>
        <label>
          <input id="showNums" type="checkbox" checked />
          Show numbers
        </label>
      </div>

      <div>
        <label>
          Number every
          <span class="q" data-tip="Show a label on every Nth nail.">?</span>
        </label>
        <input id="numEvery" type="number" value="10" min="1" />
      </div>

      <div>
        <label>Start at</label>
        <select id="numStart">
          <option value="0">0</option>
          <option value="1" selected>1</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Number size</label>
        <input id="numSize" type="number" value="12" />
      </div>

      <div>
        <label>
          Label distance
          <span class="q" data-tip="Moves numbers further from the edge.">?</span>
        </label>
        <input id="numOffset" type="number" value="22" />
      </div>
    </div>

    <div class="btns">
      <button id="fit">Fit preview</button>
      <button id="redraw">Redraw</button>
    </div>

    <h2 style="margin-top:18px;">Sequence output</h2>
    <div id="seqOut" class="mono">Nothing yet — start tapping nails.</div>

  </div>

  <canvas id="cv"></canvas>

</div>

<script src="app.js"></script>

</body>
</html>
