<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Portal — Steph</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sage:      #698F80;
      --sage-dk:   #4e6e61;
      --sage-lt:   #e8f0ec;
      --bg:        #F7F5F0;
      --card:      #ffffff;
      --text:      #2C3E35;
      --muted:     #7a8a84;
      --border:    #e2ddd6;
      --complete:  #16a34a;
      --danger:    #c0392b;
      --radius:    14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: linear-gradient(135deg, #2A3244 0%, #3D4F6E 55%, #698F80 100%);
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 40px 32px;
      max-width: 360px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .login-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dk));
      border-radius: 18px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .login-card h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .login-card p  { font-size: 0.9rem; color: var(--muted); margin-bottom: 28px; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 20px; background: #fff;
      border: 2px solid var(--border); border-radius: 12px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600; color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-google:hover { background: var(--bg); border-color: var(--sage); }
    #login-error { margin-top: 14px; font-size: 0.85rem; color: var(--danger); min-height: 20px; }

    /* ── APP SHELL ── */
    #app { display: none; }

    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .hub-link {
      font-size: 0.82rem; font-weight: 600; color: var(--muted);
      text-decoration: none; white-space: nowrap;
      padding: 6px 12px; border: 1px solid var(--border);
      border-radius: 8px; transition: background 0.15s, color 0.15s;
    }
    .hub-link:hover { background: var(--sage-lt); color: var(--sage-dk); }
    .header-title {
      font-size: 1.05rem; font-weight: 700; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-back {
      display: none; /* shown in program view */
      font-size: 0.82rem; font-weight: 600; color: var(--muted);
      padding: 6px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: none; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    .header-back:hover { background: var(--sage-lt); color: var(--sage-dk); }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── STATS ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 8px; text-align: center;
    }
    .stat-num { font-size: 1.7rem; font-weight: 700; color: var(--sage); line-height: 1.1; }
    .stat-lbl { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* ── PROGRAM GRID ── */
    .programs-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px; margin-bottom: 10px;
    }
    .program-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
      cursor: pointer; position: relative;
      transition: box-shadow 0.18s, transform 0.12s;
    }
    .program-card:hover { box-shadow: 0 6px 20px rgba(105,143,128,0.15); transform: translateY(-2px); }
    .program-card-del {
      position: absolute; top: 12px; right: 12px; background: none;
      border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 2px 7px; font-size: 0.72rem; cursor: pointer;
    }
    .program-card-del:hover { background: #fce8ec; border-color: #f0b0b8; color: var(--danger); }
    .program-card-title { font-weight: 700; font-size: 0.97rem; padding-right: 30px; margin-bottom: 4px; }
    .program-card-desc  { font-size: 0.83rem; color: var(--muted); margin-bottom: 12px; min-height: 2em; }
    .prog-wrap { background: #dde8e4; border-radius: 999px; overflow: hidden; height: 9px; }
    .prog-bar  { height: 100%; background: var(--complete); border-radius: 999px; transition: width 0.35s; }
    .prog-lbl  { font-size: 0.77rem; color: var(--muted); margin-top: 4px; }

    .add-program-btn {
      background: var(--card); border: 2px dashed var(--sage);
      color: var(--sage); border-radius: var(--radius); padding: 28px 16px;
      cursor: pointer; font-weight: 700; font-size: 0.95rem;
      font-family: inherit; width: 100%; transition: background 0.15s;
    }
    .add-program-btn:hover { background: var(--sage-lt); }

    /* ── PROGRESS BAR (program detail) ── */
    .progress-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .progress-card-bar { background: #dde8e4; border-radius: 999px; overflow: hidden; height: 12px; }
    .progress-card-fill { height: 100%; background: var(--complete); border-radius: 999px; transition: width 0.4s; }
    .progress-card-text { font-size: 0.82rem; color: var(--muted); margin-top: 5px; }

    /* ── CONTROLS ── */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .btn {
      border: none; border-radius: 9px; padding: 8px 14px;
      cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: inherit;
    }
    .btn-primary  { background: var(--sage); color: #fff; }
    .btn-primary:hover  { background: var(--sage-dk); }
    .btn-ghost    { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover    { background: var(--sage-lt); border-color: var(--sage); }
    .btn-danger   { background: #fff; border: 1px solid #f0b0b8; color: var(--danger); }
    .btn-danger:hover   { background: #fce8ec; }

    /* ── SECTIONS ── */
    .section-details {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin: 10px 0; overflow: hidden;
    }
    .section-summary {
      cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 0.92rem;
      display: flex; align-items: center; gap: 10px; list-style: none; user-select: none;
    }
    .section-summary::-webkit-details-marker { display: none; }
    .sum-title  { flex: 1; }
    .sum-chev   { flex-shrink: 0; color: var(--muted); transition: transform 0.2s; }
    .section-details[open] .sum-chev { transform: rotate(180deg); }
    .section-body { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
    .callout {
      background: var(--sage-lt); border-left: 3px solid var(--sage);
      padding: 9px 12px; border-radius: 8px; margin: 12px 0 8px; font-size: 0.88rem;
    }
    .section-content { font-size: 0.9rem; }
    .section-content p  { margin: 7px 0; }
    .section-content ul { padding-left: 18px; margin: 7px 0; }
    .section-content li { margin: 4px 0; }
    .code-block {
      background: #1f2937; color: #f9fafb; border-radius: 10px;
      padding: 12px; overflow-x: auto; font-family: Consolas, Monaco, monospace;
      font-size: 0.83rem; white-space: pre; margin: 10px 0; line-height: 1.5;
    }
    .notes-lbl { font-weight: 600; font-size: 0.84rem; margin: 12px 0 4px; }
    .notes-area {
      width: 100%; min-height: 90px; resize: vertical;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-family: inherit; font-size: 0.88rem;
      background: var(--bg); color: var(--text);
    }
    .notes-area:focus { border-color: var(--sage); outline: none; }
    .sec-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
    .del-sec-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 3px 10px; font-size: 0.76rem; cursor: pointer; font-family: inherit;
    }
    .del-sec-btn:hover { background: #fce8ec; color: var(--danger); border-color: #f0b0b8; }

    input[type="checkbox"] { transform: scale(1.25); accent-color: var(--complete); cursor: pointer; flex-shrink: 0; }

    /* ── QUESTIONS ── */
    .questions-panel {
      background: #fffbeb; border: 1px solid #fcd34d;
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
    }
    .q-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; gap: 10px; user-select: none;
    }
    .q-panel-title {
      font-weight: 700; font-size: 0.95rem; color: #92400e;
      display: flex; align-items: center; gap: 8px;
    }
    .q-open-badge {
      background: #f59e0b; color: #fff;
      border-radius: 999px; padding: 1px 8px; font-size: 0.73rem; font-weight: 700;
    }
    .q-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .q-item {
      background: #fff; border: 1px solid #fcd34d; border-radius: 9px;
      padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px;
    }
    .q-item.resolved { opacity: 0.45; }
    .q-item-body { flex: 1; min-width: 0; }
    .q-item-sec { font-size: 0.73rem; font-weight: 700; color: #92400e; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; }
    .q-item-text { font-size: 0.9rem; color: var(--text); }
    .q-item-text.done { text-decoration: line-through; }
    .q-actions { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }
    .q-gotit {
      background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46;
      border-radius: 6px; padding: 3px 9px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .q-gotit:hover { background: #d1fae5; }
    .q-del {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer; font-family: inherit;
    }
    .q-del:hover { background: #fce8ec; color: var(--danger); border-color: #f0b0b8; }
    .q-badge {
      background: #f59e0b; color: #fff; border-radius: 999px;
      padding: 1px 6px; font-size: 0.68rem; font-weight: 700; margin-left: 4px; vertical-align: middle;
    }
    .sec-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .q-add-btn {
      background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
      border-radius: 6px; padding: 3px 10px; font-size: 0.76rem;
      cursor: pointer; font-family: inherit; font-weight: 600;
    }
    .q-add-btn:hover { background: #fef3c7; }
    .q-input-wrap {
      display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .q-input-wrap textarea {
      width: 100%; min-height: 60px; resize: vertical;
      border: 1px solid #fcd34d; border-radius: 8px;
      padding: 7px 10px; font-family: inherit; font-size: 0.88rem;
      background: #fffbeb; color: var(--text);
    }
    .q-input-wrap textarea:focus { border-color: #f59e0b; outline: none; }
    .q-save-btn {
      margin-top: 6px; background: #f59e0b; color: #fff; border: none;
      border-radius: 7px; padding: 6px 14px; font-size: 0.84rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .q-save-btn:hover { background: #d97706; }

    /* ── ADD SECTION + WEEKLY ── */
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-top: 18px;
    }
    .panel h3 { font-size: 0.97rem; font-weight: 700; margin-bottom: 12px; }
    .form-label { display: block; font-weight: 600; font-size: 0.83rem; margin-bottom: 4px; }
    .form-input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 0.88rem;
      background: var(--bg); color: var(--text); margin-bottom: 10px;
    }
    .form-input:focus { border-color: var(--sage); outline: none; }
    textarea.form-input { min-height: 80px; resize: vertical; }

    .tick-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; margin: 6px 0;
      font-size: 0.9rem; cursor: pointer;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 32px 16px; color: var(--muted);
      border: 2px dashed var(--border); border-radius: 12px; margin: 8px 0;
    }
    .empty-state p { margin-top: 6px; font-size: 0.86rem; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 200;
      align-items: flex-start; justify-content: center;
      padding: 80px 20px 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 20px; padding: 28px;
      width: 100%; max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    /* ── TOAST ── */
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 300; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none; align-items: center;
    }
    .toast {
      background: #1f2937; color: #fff; padding: 10px 18px;
      border-radius: 10px; font-size: 0.88rem; font-weight: 600;
      animation: toastIn 0.2s ease;
    }
    .toast.success { background: #166534; }
    .toast.warning { background: #92400e; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .programs-grid { grid-template-columns: 1fr; }
    }

    /* ── PRINT ── */
    @media print {
      #login-screen, header .hub-link, header .header-back,
      .controls, .panel, .sec-footer { display: none !important; }
      .section-details { page-break-inside: avoid; }
      .section-details:not([open]) .section-body { display: block; }
      .sum-chev { display: none; }
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">📚</div>
    <h1>Training Portal</h1>
    <p>Sign in to access your learning programs</p>
    <button class="btn-google" onclick="startSignIn()">
      <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <a class="hub-link" href="/portal/">&#8592; My Hub</a>
    <button class="header-back" id="hdr-back" onclick="showHome()">&#8592; All Programs</button>
    <div class="header-title" id="hdr-title">Training Portal</div>
    <button class="btn btn-ghost" onclick="exportBackup()" title="Download backup" style="flex-shrink:0;font-size:0.82rem;padding:7px 11px;">⬇ Backup</button>
    <label class="btn btn-ghost" title="Restore from backup" style="flex-shrink:0;font-size:0.82rem;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;">
      ⬆ Restore<input type="file" accept=".json" onchange="importBackup(this)" style="display:none">
    </label>
    <button class="btn btn-primary" id="hdr-new-btn" onclick="openModal()" style="flex-shrink:0;">+ New</button>
  </header>

  <div class="container">

    <!-- HOME VIEW -->
    <div id="view-home">
      <div id="stats-row" class="stats-row"></div>
      <div id="programs-grid" class="programs-grid"></div>
    </div>

    <!-- PROGRAM DETAIL VIEW -->
    <div id="view-program" style="display:none">

      <div id="questions-panel"></div>

      <div class="progress-card">
        <div class="progress-card-bar"><div class="progress-card-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="progress-card-text" id="prog-text">0% complete</div>
      </div>

      <div class="controls">
        <button class="btn btn-ghost" onclick="openAll()">Open all</button>
        <button class="btn btn-ghost" onclick="closeAll()">Close all</button>
        <button class="btn btn-ghost" onclick="window.print()">Print / PDF</button>
        <button class="btn btn-ghost" onclick="resetProgram()">Reset progress</button>
        <button class="btn btn-danger" onclick="deleteCurrentProgram()">Delete program</button>
      </div>

      <div id="sections-container"></div>

      <!-- Add section -->
      <div class="panel">
        <h3>Add a Section</h3>
        <label class="form-label" for="new-sec-title">Section title</label>
        <input type="text" class="form-input" id="new-sec-title" placeholder="e.g. Firebase backups" />
        <label class="form-label" for="new-sec-content">Content / notes</label>
        <textarea class="form-input" id="new-sec-content" placeholder="Add your learning points, links, or notes here..."></textarea>
        <button class="btn btn-primary" onclick="addSection()" style="margin-top:4px;">Add section</button>
      </div>

      <!-- Weekly checklist -->
      <div class="panel">
        <h3>Weekly Learning Checklist</h3>
        <label class="tick-row"><input type="checkbox" data-weekly="w1"> Read at least one section</label>
        <label class="tick-row"><input type="checkbox" data-weekly="w2"> Write notes in my own words</label>
        <label class="tick-row"><input type="checkbox" data-weekly="w3"> Apply one idea to a real project</label>
        <label class="tick-row"><input type="checkbox" data-weekly="w4"> Save or commit any project changes</label>
        <label class="tick-row"><input type="checkbox" data-weekly="w5"> Write down what confused me</label>
      </div>
    </div>

  </div><!-- end container -->
</div><!-- end app -->

<!-- New program modal -->
<div class="modal-overlay" id="new-prog-modal">
  <div class="modal">
    <h2>New Training Program</h2>
    <label class="form-label" for="modal-prog-title">Program title *</label>
    <input type="text" class="form-input" id="modal-prog-title" placeholder="e.g. Firebase Deep Dive" />
    <label class="form-label" for="modal-prog-desc">Description (optional)</label>
    <textarea class="form-input" id="modal-prog-desc" placeholder="What will this program cover?"></textarea>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="createProgram()">Create Program</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>

var auth  = firebase.auth();
var db    = firebase.database();

var ALLOWED = [
  'stephrawlingscreations@gmail.com',
  'sdr22ie@gmail.com',
  'sdr22uk@gmail.com'
];

var LS_KEY   = 'steph_training_v2';
var FB_PATH  = 'focusflow/steph/training';

/* ── localStorage helpers ── */
function lsGet()      { try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function lsSet(data)  { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {} }

/* ── Firebase push (background) ── */
function fbPush(data) { db.ref(FB_PATH).set(data).catch(function(e) { console.warn('Firebase sync:', e); }); }

function saveData(data) { lsSet(data); fbPush(data); }

function exportBackup() {
  var data = lsGet();
  if (!data) { toast('Nothing to back up yet.'); return; }
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  var d    = new Date();
  var ds   = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = 'training-backup-' + ds + '.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded.');
}

function importBackup(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.programs)) { toast('Invalid backup file — not restored.'); return; }
      saveData(data);
      renderHome();
      toast('Backup restored.');
    } catch(err) {
      toast('Could not read file.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function pullFromFirebase(cb) {
  db.ref(FB_PATH).once('value').then(function(snap) {
    var remote = snap.val();
    if (remote) lsSet(remote);
    cb();
  }).catch(function() { cb(); });
}

/* ════════════════════════════════════════════════════
   AUTH
════════════════════════════════════════════════════ */
var pendingMsg = '';

function startSignIn() {
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      auth.signInWithRedirect(provider);
    } else {
      document.getElementById('login-error').textContent = 'Sign-in failed: ' + e.message;
    }
  });
}

auth.getRedirectResult().catch(function(e) {
  if (e && e.message) document.getElementById('login-error').textContent = 'Sign-in failed: ' + e.message;
});

auth.onAuthStateChanged(function(user) {
  if (user) {
    if (!ALLOWED.some(function(a) { return a.toLowerCase() === user.email.toLowerCase(); })) {
      pendingMsg = 'That Google account is not on the access list.';
      auth.signOut();
      return;
    }
    pullFromFirebase(bootApp);
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if (pendingMsg) { document.getElementById('login-error').textContent = pendingMsg; pendingMsg = ''; }
  }
});

function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initData();
  showHome();
}

/* ════════════════════════════════════════════════════
   DATA — built-in programs
════════════════════════════════════════════════════ */
var BUILT_IN_IDS = [
  'software_dev','recommended_phase1','recommended_phase2','recommended_phase3',
  'lakeside_golive','everyday_dev_tools','business_client_skills','professional_standards'
];

function getBuiltIn(id) {
  switch(id) {
    case 'software_dev':           return prog_softwareDev();
    case 'recommended_phase1':     return prog_phase1();
    case 'recommended_phase2':     return prog_phase2();
    case 'recommended_phase3':     return prog_phase3();
    case 'lakeside_golive':        return prog_lakeside();
    case 'everyday_dev_tools':     return prog_devtools();
    case 'business_client_skills': return prog_business();
    case 'professional_standards': return prog_professional();
  }
}

function initData() {
  var data = lsGet();
  if (!data) {
    data = { programs: BUILT_IN_IDS.map(getBuiltIn) };
    saveData(data);
  } else {
    var changed = false;
    BUILT_IN_IDS.forEach(function(id) {
      if (!data.programs.find(function(p) { return p.id === id; })) {
        data.programs.push(getBuiltIn(id));
        changed = true;
      }
    });
    if (changed) saveData(data);
  }
}

function getData() {
  var data = lsGet();
  if (!data) { initData(); data = lsGet(); }
  return data;
}

/* ════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════ */
var currentProgramId = null;

/* ════════════════════════════════════════════════════
   VIEWS
════════════════════════════════════════════════════ */
function showHome() {
  currentProgramId = null;
  document.getElementById('view-home').style.display = '';
  document.getElementById('view-program').style.display = 'none';
  document.getElementById('hdr-title').textContent = 'Training Portal';
  document.getElementById('hdr-back').style.display = 'none';
  document.getElementById('hdr-new-btn').style.display = '';
  window.scrollTo(0, 0);
  renderHome();
}

function showProgram(id) {
  currentProgramId = id;
  var data    = getData();
  var program = data.programs.find(function(p) { return p.id === id; });
  if (!program) { showHome(); return; }
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-program').style.display = '';
  document.getElementById('hdr-title').textContent = program.title;
  document.getElementById('hdr-back').style.display = '';
  document.getElementById('hdr-new-btn').style.display = 'none';
  window.scrollTo(0, 0);
  renderProgram(program);
}

/* ════════════════════════════════════════════════════
   HOME RENDERING
════════════════════════════════════════════════════ */
function renderHome() {
  var data = getData();
  var totalSec = 0, totalDone = 0;
  data.programs.forEach(function(p) {
    (p.sections || []).forEach(function(s) {
      totalSec++;
      if (p.checks && p.checks[s.id]) totalDone++;
    });
  });
  var pct = totalSec > 0 ? Math.round(totalDone / totalSec * 100) : 0;

  document.getElementById('stats-row').innerHTML =
    stat(data.programs.length, 'Programs') +
    stat(totalSec, 'Sections') +
    stat(totalDone, 'Done') +
    stat(pct + '%', 'Overall');

  var html = '';
  data.programs.forEach(function(p) {
    var secs    = p.sections || [];
    var total   = secs.length;
    var checked = secs.filter(function(s) { return p.checks && p.checks[s.id]; }).length;
    var pct2    = total > 0 ? Math.round(checked / total * 100) : 0;
    html += '<div class="program-card" onclick="showProgram(\'' + esc(p.id) + '\')">'
      + '<button class="program-card-del" onclick="event.stopPropagation();confirmDeleteProgram(\'' + esc(p.id) + '\')">&#x2715;</button>'
      + '<div class="program-card-title">' + eh(p.title) + '</div>'
      + '<div class="program-card-desc">' + eh(p.description || '') + '</div>'
      + '<div class="prog-wrap"><div class="prog-bar" style="width:' + pct2 + '%"></div></div>'
      + '<div class="prog-lbl">' + pct2 + '% &bull; ' + checked + ' of ' + total + ' sections</div>'
      + '</div>';
  });
  html += '<button class="add-program-btn" onclick="openModal()">+ New Training Program</button>';
  document.getElementById('programs-grid').innerHTML = html;
}

function stat(num, lbl) {
  return '<div class="stat"><div class="stat-num">' + num + '</div><div class="stat-lbl">' + lbl + '</div></div>';
}

/* ════════════════════════════════════════════════════
   PROGRAM DETAIL RENDERING
════════════════════════════════════════════════════ */
function renderProgram(program) {
  updateProgress(program);
  renderQuestionsPanel(program);
  renderSections(program);
  loadWeeklyChecks(program);
}

function updateProgress(program) {
  var secs    = program.sections || [];
  var total   = secs.length;
  var checked = secs.filter(function(s) { return program.checks && program.checks[s.id]; }).length;
  var pct     = total > 0 ? Math.round(checked / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = pct + '% complete (' + checked + ' of ' + total + ' sections)';
}

function renderSections(program) {
  var container = document.getElementById('sections-container');
  var secs = program.sections || [];
  if (!secs.length) {
    container.innerHTML = '<div class="empty-state"><strong>No sections yet.</strong><p>Use the form below to add your first section.</p></div>';
    return;
  }
  container.innerHTML = secs.map(function(s, i) {
    var checked  = program.checks && program.checks[s.id] ? 'checked' : '';
    var noteVal  = (program.notes && program.notes[s.id]) || '';
    var openQs   = (program.questions && program.questions[s.id] || []).filter(function(q) { return !q.resolved; }).length;
    var qBadge   = openQs > 0 ? '<span class="q-badge">❓ ' + openQs + '</span>' : '';
    var body     = '';
    if (s.goal)    body += '<div class="callout">' + eh(s.goal) + '</div>';
    if (s.content) body += '<p>' + eh(s.content) + '</p>';
    if (s.bullets && s.bullets.length) body += '<ul>' + s.bullets.map(function(b) { return '<li>' + eh(b) + '</li>'; }).join('') + '</ul>';
    if (s.code)    body += '<pre class="code-block">' + eh(s.code) + '</pre>';
    if (s.extra)   body += '<p><em>' + eh(s.extra) + '</em></p>';
    return '<details class="section-details" id="det-' + esc(s.id) + '">'
      + '<summary class="section-summary">'
      + '<input type="checkbox" ' + checked + ' onclick="event.stopPropagation()" onchange="toggleSection(\'' + esc(s.id) + '\',this.checked)">'
      + '<span class="sum-title">Section ' + (i+1) + ' &ndash; ' + eh(s.title) + qBadge + '</span>'
      + '<svg class="sum-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>'
      + '</summary>'
      + '<div class="section-body">'
      + '<div class="section-content">' + body + '</div>'
      + '<div class="notes-lbl">Your notes</div>'
      + '<textarea class="notes-area" placeholder="Write your notes here..." oninput="saveNote(\'' + esc(s.id) + '\',this.value)">' + eh(noteVal) + '</textarea>'
      + '<div class="sec-footer">'
      + '<button class="q-add-btn" onclick="toggleQInput(\'' + esc(s.id) + '\')">❓ Add question</button>'
      + '<button class="del-sec-btn" onclick="deleteSection(\'' + esc(s.id) + '\')">Remove section</button>'
      + '</div>'
      + '<div class="q-input-wrap" id="q-input-' + esc(s.id) + '">'
      + '<textarea placeholder="What do you want to look up about this section?"></textarea>'
      + '<button class="q-save-btn" onclick="saveQuestion(\'' + esc(s.id) + '\')">Save question</button>'
      + '</div>'
      + '</div></details>';
  }).join('');
}

/* ════════════════════════════════════════════════════
   SECTION ACTIONS
════════════════════════════════════════════════════ */
function toggleSection(id, checked) {
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  if (!p.checks) p.checks = {};
  p.checks[id] = checked;
  saveData(data);
  updateProgress(p);
}

function saveNote(id, val) {
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  if (!p.notes) p.notes = {};
  p.notes[id] = val;
  saveData(data);
}

/* ════════════════════════════════════════════════════
   QUESTIONS
════════════════════════════════════════════════════ */
var qPanelOpen = true;

function renderQuestionsPanel(program) {
  var panel = document.getElementById('questions-panel');
  var qs    = program.questions || {};
  var secs  = program.sections  || [];
  var all   = [];
  secs.forEach(function(s) {
    (qs[s.id] || []).forEach(function(q) { all.push({ q: q, sec: s }); });
  });
  if (!all.length) { panel.innerHTML = ''; return; }
  var open = all.filter(function(x) { return !x.q.resolved; }).length;
  var listHtml = all.map(function(x) {
    return '<div class="q-item' + (x.q.resolved ? ' resolved' : '') + '">'
      + '<div class="q-item-body">'
      + '<div class="q-item-sec">' + eh(x.sec.title) + '</div>'
      + '<div class="q-item-text' + (x.q.resolved ? ' done' : '') + '">' + eh(x.q.text) + '</div>'
      + '</div>'
      + '<div class="q-actions">'
      + (!x.q.resolved
          ? '<button class="q-gotit" onclick="resolveQuestion(\'' + esc(x.sec.id) + '\',\'' + esc(x.q.id) + '\')">✓ Got it</button>'
          : '<span style="font-size:0.73rem;color:var(--muted);">Done</span>')
      + '<button class="q-del" onclick="deleteQuestion(\'' + esc(x.sec.id) + '\',\'' + esc(x.q.id) + '\')">✕</button>'
      + '</div>'
      + '</div>';
  }).join('');
  panel.innerHTML = '<div class="questions-panel">'
    + '<div class="q-panel-header" onclick="toggleQPanel()">'
    + '<div class="q-panel-title">❓ My Questions'
    + (open ? '<span class="q-open-badge">' + open + ' open</span>' : '')
    + '</div>'
    + '<svg id="q-chev" style="transition:transform 0.2s;' + (qPanelOpen ? '' : 'transform:rotate(-90deg)') + '" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>'
    + '</div>'
    + '<div id="q-list" class="q-list" style="' + (qPanelOpen ? '' : 'display:none') + '">' + listHtml + '</div>'
    + '</div>';
}

function toggleQPanel() {
  qPanelOpen = !qPanelOpen;
  var list = document.getElementById('q-list');
  var chev = document.getElementById('q-chev');
  if (list) list.style.display = qPanelOpen ? '' : 'none';
  if (chev) chev.style.transform = qPanelOpen ? '' : 'rotate(-90deg)';
}

function toggleQInput(secId) {
  var wrap = document.getElementById('q-input-' + secId);
  if (!wrap) return;
  var opening = wrap.style.display === 'none' || wrap.style.display === '';
  wrap.style.display = opening ? 'block' : 'none';
  if (opening) wrap.querySelector('textarea').focus();
}

function saveQuestion(secId) {
  var wrap = document.getElementById('q-input-' + secId);
  var ta   = wrap ? wrap.querySelector('textarea') : null;
  if (!ta) return;
  var text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  if (!p.questions)        p.questions = {};
  if (!p.questions[secId]) p.questions[secId] = [];
  p.questions[secId].push({ id: 'q_' + Date.now(), text: text, resolved: false });
  saveData(data);
  ta.value = '';
  wrap.style.display = 'none';
  renderQuestionsPanel(p);
  renderSections(p);
  toast('Question saved.');
}

function resolveQuestion(secId, qId) {
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p || !p.questions || !p.questions[secId]) return;
  var q = p.questions[secId].find(function(q) { return q.id === qId; });
  if (q) q.resolved = true;
  saveData(data);
  renderQuestionsPanel(p);
  renderSections(p);
  toast('Got it — question resolved!');
}

function deleteQuestion(secId, qId) {
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p || !p.questions || !p.questions[secId]) return;
  p.questions[secId] = p.questions[secId].filter(function(q) { return q.id !== qId; });
  saveData(data);
  renderQuestionsPanel(p);
  renderSections(p);
}

function deleteSection(id) {
  if (!confirm('Remove this section? Notes for it will also be deleted.')) return;
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  p.sections = p.sections.filter(function(s) { return s.id !== id; });
  if (p.checks)    delete p.checks[id];
  if (p.notes)     delete p.notes[id];
  if (p.questions) delete p.questions[id];
  saveData(data);
  renderProgram(p);
  toast('Section removed.');
}

function addSection() {
  var titleEl = document.getElementById('new-sec-title');
  var contEl  = document.getElementById('new-sec-content');
  var title   = titleEl.value.trim();
  if (!title) { toast('Please enter a section title.', 'warning'); titleEl.focus(); return; }
  var data    = getData();
  var p       = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  var newSec  = { id: 'sec_' + Date.now(), title: title, content: contEl.value.trim() };
  if (!p.sections) p.sections = [];
  p.sections.push(newSec);
  saveData(data);
  titleEl.value = ''; contEl.value = '';
  renderProgram(p);
  toast('Section added.', 'success');
  setTimeout(function() {
    var el = document.getElementById('det-' + newSec.id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

/* ════════════════════════════════════════════════════
   WEEKLY CHECKLIST
════════════════════════════════════════════════════ */
function loadWeeklyChecks(program) {
  var checks = program.weeklyChecks || {};
  document.querySelectorAll('[data-weekly]').forEach(function(cb) {
    cb.checked  = !!checks[cb.dataset.weekly];
    cb.onchange = function() {
      var data = getData();
      var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
      if (!p) return;
      if (!p.weeklyChecks) p.weeklyChecks = {};
      p.weeklyChecks[cb.dataset.weekly] = cb.checked;
      saveData(data);
    };
  });
}

/* ════════════════════════════════════════════════════
   PROGRAM MANAGEMENT
════════════════════════════════════════════════════ */
function openModal() {
  document.getElementById('modal-prog-title').value = '';
  document.getElementById('modal-prog-desc').value  = '';
  document.getElementById('new-prog-modal').classList.add('open');
  setTimeout(function() { document.getElementById('modal-prog-title').focus(); }, 60);
}
function closeModal() { document.getElementById('new-prog-modal').classList.remove('open'); }

document.getElementById('new-prog-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

function createProgram() {
  var title = document.getElementById('modal-prog-title').value.trim();
  var desc  = document.getElementById('modal-prog-desc').value.trim();
  if (!title) { toast('Please enter a program title.', 'warning'); document.getElementById('modal-prog-title').focus(); return; }
  var data  = getData();
  var prog  = { id: 'prog_' + Date.now(), title: title, description: desc,
                createdAt: new Date().toISOString(), sections: [], checks: {}, notes: {}, weeklyChecks: {} };
  data.programs.push(prog);
  saveData(data);
  closeModal();
  toast('"' + title + '" created.', 'success');
  showProgram(prog.id);
}

function confirmDeleteProgram(id) {
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === id; });
  if (!p) return;
  if (data.programs.length <= 1) { toast('You need at least one program.', 'warning'); return; }
  if (!confirm('Delete "' + p.title + '"? This cannot be undone.')) return;
  data.programs = data.programs.filter(function(p) { return p.id !== id; });
  saveData(data);
  renderHome();
}

function deleteCurrentProgram() {
  if (!currentProgramId) return;
  var data = getData();
  if (data.programs.length <= 1) { toast('You need at least one program.', 'warning'); return; }
  var p = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p || !confirm('Delete "' + p.title + '"? This cannot be undone.')) return;
  data.programs = data.programs.filter(function(p) { return p.id !== currentProgramId; });
  saveData(data);
  showHome();
}

function resetProgram() {
  if (!currentProgramId || !confirm('Reset all ticks and notes for this program?')) return;
  var data = getData();
  var p    = data.programs.find(function(p) { return p.id === currentProgramId; });
  if (!p) return;
  p.checks = {}; p.notes = {}; p.weeklyChecks = {};
  saveData(data);
  renderProgram(p);
  toast('Progress reset.', 'success');
}

function openAll()  { document.querySelectorAll('#sections-container details').forEach(function(d) { d.open = true;  }); }
function closeAll() { document.querySelectorAll('#sections-container details').forEach(function(d) { d.open = false; }); }

/* ════════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════════ */
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(function() { el.remove(); }, 2800);
}

/* ════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════ */
function eh(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function esc(s) { return String(s).replace(/'/g,"\\'"); }

/* ════════════════════════════════════════════════════
   PROGRAM DATA
════════════════════════════════════════════════════ */
function makeProgram(id, title, description, sections) {
  return { id: id, title: title, description: description,
           createdAt: new Date().toISOString(), checks: {}, notes: {}, weeklyChecks: {}, sections: sections };
}
function sec(id, title, goal, content, bullets, code, extra) {
  var s = { id: id, title: title };
  if (goal)    s.goal    = goal;
  if (content) s.content = content;
  if (bullets) s.bullets = bullets;
  if (code)    s.code    = code;
  if (extra)   s.extra   = extra;
  return s;
}

       'Web app: tracker, portal, dashboard, booking system.',
       'Your string art designer is closer to a static/browser-based app.',
       'Your sales trackers and Lakeside portal are more like web apps — they need data and logins.']),
    sec('s3','Frontend, Backend and Database','Understand the three main layers of most apps.',

    sec('s4','What Firebase Actually Is','Understand why Firebase feels like lots of things at once.',

      ['Firebase Hosting: serves your website or app files.','Firestore / Realtime Database: stores your app data.',

    sec('s5','GitHub and Version Control','Understand GitHub as your project history and safety net.',

    sec('s6','Hosting Types','Know what to use for different kinds of projects.',null,

    sec('s7','Deployment','Understand how changes go live.',

    sec('s8','Development, Staging and Production','Avoid breaking live apps while learning.',

      null,'The rule of thumb: never experiment directly on the live app if you can avoid it.'),
    sec('s9','Database Thinking','Learn to think like an app designer.',

    sec('s10','Authentication and Permissions','Understand logins and access control.',

      ['Admin users: see and edit everything.','Staff users: see only assigned jobs or their area.',

    sec('s11','Firebase Security Rules','Know why database rules matter.',

       'A common beginner mistake: leaving the database open to everyone.',

    sec('s12','APIs Explained Simply','Understand how software talks to software.',
      'An API is a controlled, structured way for one system to communicate with another.',

    sec('s13','Your String Art Site Architecture','Understand your own site as a real software system.',

    sec('s14','Your Lakeside Portal Architecture','Understand why the portal is more complex than a normal website.',

    sec('s15','SaaS Basics','Understand the business model behind portals and online tools.',
      'SaaS = Software as a Service. Users access it online, usually on a subscription.',

       'Your portals and trackers are moving in this direction.']),
    sec('s16','Project Organisation','Stop projects becoming chaotic as they grow.',

      'Even small projects benefit from clear names and a basic README.'),
    sec('s17','Debugging Basics','Learn how to calmly find what is broken.',

      ['1. Reproduce the issue — can you make it happen reliably?',

    sec('s18','Managing Live Apps','Know what needs checking after launch.',

function prog_lakeside() {
