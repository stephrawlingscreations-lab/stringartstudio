<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV Tracker">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/tv-32.png" />
<link rel="apple-touch-icon" href="../icons/tv-180.png" sizes="180x180" />
<meta name="theme-color" content="#0c101c" />
<meta name="robots" content="noindex, nofollow">
<title>IPTV Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: "Outfit", system-ui, sans-serif;
    --font-mono: "DM Mono", ui-monospace, monospace;
    --bg: #06080f;
    --bg-elevated: #0c101c;
    --surface: #12182a;
    --surface2: #1a2238;
    --surface3: #222c45;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f1f5ff;
    --muted: #8b95b0;
    --ui-glow: #7c3aed;
    --accent: #a78bfa;
    --accent2: #22d3ee;
    --danger: #fb7185;
    --warn: #fbbf24;
    --ok: #4ade80;
    --jungle: #fbbf24;
    --jungle-dim: rgba(251, 191, 36, 0.14);
    --stream: #22d3ee;
    --stream-dim: rgba(34, 211, 238, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    overflow-x: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -30%, rgba(124, 58, 237, 0.18), transparent 50%),
      radial-gradient(ellipse 90% 50% at 100% 20%, rgba(34, 211, 238, 0.06), transparent 42%),
      radial-gradient(ellipse 70% 40% at 0% 60%, rgba(251, 191, 36, 0.05), transparent 45%),
      linear-gradient(180deg, #080b14 0%, var(--bg) 55%, #03040a 100%);
    background-attachment: fixed;
  }

  #auth-loading {
    position: fixed; inset: 0; z-index: 1001;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.15), var(--bg));
    color: var(--muted); font-size: 15px; font-weight: 500; gap: 14px;
  }
  .auth-spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid var(--border2); border-top-color: var(--stream);
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #login-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(165deg, #0f0820 0%, #06080f 45%, #0a1528 100%);
  }
  .login-card {
    width: 100%; max-width: 400px;
    background: linear-gradient(165deg, var(--surface) 0%, var(--bg-elevated) 100%);
    border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 2rem 1.5rem; text-align: center;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(167, 139, 250, 0.08);
  }
  .login-card .login-logo { font-size: 2.5rem; line-height: 1; margin-bottom: 0.5rem; }
  .login-card .login-brand { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
  .login-card .login-brand span { background: linear-gradient(135deg, var(--jungle), var(--stream)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-card .login-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 1.5rem; }
  .login-btn-google {
    width: 100%; padding: 14px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--surface2); color: var(--text);
    font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .login-btn-google:hover { background: var(--surface3); border-color: rgba(167, 139, 250, 0.35); }
  .login-btn-google:active { opacity: 0.94; }
  .login-btn-google svg { flex-shrink: 0; }
  #login-error { font-size: 13px; color: var(--danger); margin-top: 14px; min-height: 20px; font-weight: 600; }

  #app { display: none; padding-bottom: 108px; }

  .header {
    padding: max(52px, env(safe-area-inset-top)) 20px 18px;
    background: linear-gradient(180deg, rgba(15, 8, 32, 0.95) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .header-brand-block { min-width: 0; }
  .app-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
  .app-title span {
    background: linear-gradient(135deg, #fde68a, var(--stream));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header-tagline { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }
  .header-date {
    display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    padding: 6px 12px; border-radius: var(--radius-pill);
    background: var(--surface2); border: 1px solid var(--border);
  }
  .header-btns { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn:hover { border-color: rgba(167, 139, 250, 0.4); background: var(--surface3); }
  .hdr-signout {
    padding: 9px 14px; border-radius: var(--radius-pill);
    border: 1px solid var(--border2); background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 600; font-family: var(--font); cursor: pointer; white-space: nowrap;
  }
  .hdr-signout:hover { color: var(--text); border-color: var(--muted); }

  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    padding: 0 20px 18px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 8px 10px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: linear-gradient(180deg, var(--ui-glow), var(--stream));
    opacity: 0.85;
  }
  .stat-card:nth-child(2)::after { background: linear-gradient(180deg, var(--danger), #fb7185); }
  .stat-card:nth-child(3)::after { background: linear-gradient(180deg, var(--warn), #fcd34d); }
  .stat-card:nth-child(4)::after { background: linear-gradient(180deg, var(--ok), #86efac); }
  .stat-val { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat-val.red { color: var(--danger); }
  .stat-val.amber { color: var(--warn); }
  .stat-val.green { color: var(--ok); }
  .stat-lbl { font-size: 9px; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

  .tabs-wrap { padding: 0 20px 14px; }
  .tabs {
    display: flex; gap: 6px; padding: 5px;
    background: var(--surface); border-radius: var(--radius-pill);
    border: 1px solid var(--border); box-shadow: var(--shadow-card);
  }
  .tab {
    flex: 1; padding: 12px 10px; border-radius: var(--radius-pill); border: none;
    background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 600; font-family: var(--font); cursor: pointer;
    transition: color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .tab.active-jungle {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(245, 158, 11, 0.12));
    color: #fde68a;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.35);
  }
  .tab.active-stream {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(6, 182, 212, 0.1));
    color: #a5f3fc;
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.12);
    border: 1px solid rgba(34, 211, 238, 0.35);
  }

  .search-wrap { padding: 0 20px 12px; }
  .search {
    width: 100%; padding: 14px 16px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 15px; font-family: var(--font);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus { outline: none; border-color: rgba(167, 139, 250, 0.45); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }
  .search::placeholder { color: var(--muted); }

  .filter-row { display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-pill {
    padding: 8px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600;
    font-family: var(--font); cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .filter-pill.active {
    border-color: rgba(167, 139, 250, 0.5); color: var(--accent);
    background: rgba(124, 58, 237, 0.18);
    box-shadow: 0 0 16px rgba(124, 58, 237, 0.12);
  }

  .section-label { font-size: 10px; color: var(--muted); padding: 0 20px 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .cards { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: linear-gradient(165deg, var(--surface) 0%, var(--bg-elevated) 100%);
    border-radius: var(--radius); border: 1px solid var(--border2);
    padding: 16px 16px 16px 18px; position: relative; overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
  .card.jungle::before {
    background: linear-gradient(180deg, #fcd34d, var(--jungle));
    box-shadow: 0 0 16px rgba(251, 191, 36, 0.35);
  }
  .card.stream::before {
    background: linear-gradient(180deg, #67e8f9, var(--stream));
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.35);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
  .card-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .card-tvs { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .badge { padding: 5px 11px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge.ok { background: rgba(74, 222, 128, 0.12); color: var(--ok); border: 1px solid rgba(74, 222, 128, 0.25); }
  .badge.soon { background: rgba(251, 191, 36, 0.12); color: var(--warn); border: 1px solid rgba(251, 191, 36, 0.28); }
  .badge.overdue { background: rgba(251, 113, 133, 0.12); color: var(--danger); border: 1px solid rgba(251, 113, 133, 0.28); }
  .badge.nodate { background: rgba(139, 149, 176, 0.12); color: var(--muted); border: 1px solid var(--border); }

  .card-creds { display: flex; gap: 10px; margin-bottom: 10px; }
  .cred {
    flex: 1; background: var(--surface2); border-radius: var(--radius-sm);
    padding: 10px 11px; min-width: 0; cursor: pointer; position: relative;
    transition: background 0.15s, border-color 0.15s; user-select: none;
    border: 1px solid transparent;
  }
  .cred:hover { border-color: var(--border2); }
  .cred:active { background: var(--surface3); }
  .cred.copied { background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.3); }
  .cred-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .cred-copy-hint { font-size: 9px; color: var(--muted); opacity: 0.65; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .cred-val { font-family: var(--font-mono); font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cred-copied-flash {
    position: absolute; inset: 0; background: rgba(74, 222, 128, 0.18);
    border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--ok); opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .cred-copied-flash.show { opacity: 1; }

  .card-footer { display: flex; justify-content: space-between; align-items: center; }
  .renewal-info { font-size: 13px; color: var(--muted); font-weight: 500; }
  .renewal-info strong { color: var(--text); font-weight: 700; }
  .price-tag { font-size: 14px; font-weight: 700; color: var(--stream); }

  .card-notes {
    font-size: 12px; color: var(--muted); margin-top: 8px; padding: 10px 12px;
    background: var(--surface2); border-radius: var(--radius-sm);
    border-left: 3px solid rgba(167, 139, 250, 0.5); font-weight: 500;
  }

  .card-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .btn-sm {
    flex: 1; min-width: 64px; padding: 10px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    font-size: 12px; font-weight: 600; font-family: var(--font); cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-sm:hover { background: var(--surface3); color: var(--text); }
  .btn-sm.edit { color: var(--accent); border-color: rgba(167, 139, 250, 0.35); background: rgba(124, 58, 237, 0.12); }
  .btn-sm.del { color: var(--danger); border-color: rgba(251, 113, 133, 0.35); }
  .btn-sm.wa { color: #4ade80; border-color: rgba(74, 222, 128, 0.35); }
  .btn-sm.renew { color: var(--warn); border-color: rgba(251, 191, 36, 0.35); }

  .empty { text-align: center; padding: 64px 24px; color: var(--muted); font-size: 15px; font-weight: 500; line-height: 1.5; }

  #toast {
    position: fixed; bottom: 118px; left: 50%; transform: translateX(-50%);
    max-width: min(360px, 92vw);
    background: var(--surface3); border: 1px solid var(--border2);
    color: var(--text); padding: 14px 20px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity 0.22s; z-index: 500; white-space: normal; text-align: center; line-height: 1.4;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  #toast.show { opacity: 1; }

  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(2, 4, 12, 0.72); backdrop-filter: blur(8px);
    z-index: 200; align-items: flex-end;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg-elevated) 100%);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 20px max(32px, env(safe-area-inset-bottom));
    width: 100%; max-height: 90vh; overflow-y: auto;
    border: 1px solid var(--border2); border-bottom: none;
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.45);
  }
  .modal-handle { width: 40px; height: 5px; background: var(--surface3); border-radius: 3px; margin: 0 auto 18px; }
  .modal h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.02em; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select {
    width: 100%; padding: 14px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 15px; font-family: var(--font); -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { outline: none; border-color: rgba(167, 139, 250, 0.55); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18); }
  .field select option { background: var(--surface2); color: var(--text); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-save {
    flex: 2; padding: 15px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; color: #fff;
    font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
  }
  .btn-save:active { transform: scale(0.99); }
  .btn-cancel {
    flex: 1; padding: 15px; border-radius: var(--radius-sm);
    background: var(--surface2); border: 1px solid var(--border2); color: var(--muted);
    font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer;
  }
  .field-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(12, 16, 28, 0.82); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border2);
    padding: 12px 20px max(22px, env(safe-area-inset-bottom));
    box-shadow: 0 -4px 32px rgba(0, 0, 0, 0.35);
  }
  .nav-add {
    width: 100%; padding: 15px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--stream), #0891b2); border: none; color: #042f2e;
    font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer;
    box-shadow: 0 6px 24px rgba(34, 211, 238, 0.28);
  }
  .nav-add:active { transform: scale(0.99); opacity: 0.95; }

  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .card-actions .btn-sm { flex: 1 1 calc(50% - 8px); min-width: calc(50% - 8px); }
    .two-col { grid-template-columns: 1fr; }
  }

  @media (max-width: 380px) {
    .stats-row { gap: 8px; }
    .stat-val { font-size: 1.15rem; }
    .stat-lbl { font-size: 8px; }
    .header-btns { flex-wrap: wrap; justify-content: flex-end; }
  }
</style>
</head>
<body>

<a href="/portal/" class="hub-back-btn">← Hub</a>
<style>.hub-back-btn{position:fixed;top:14px;left:14px;z-index:99999;background:rgba(42,50,68,0.82);color:#fff;text-decoration:none;font-size:.75rem;font-weight:600;padding:6px 13px;border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:.02em;transition:background .15s}.hub-back-btn:hover{background:rgba(42,50,68,1)}</style>

<div id="auth-loading">
  <div class="auth-spinner" aria-hidden="true"></div>
  <div>Loading IPTV…</div>
</div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo" aria-hidden="true">&#x1F4FA;</div>
    <div class="login-brand">IPTV <span>Tracker</span></div>
    <p class="login-sub">Sign in with your Google account to load and sync your subscriber list (same idea as PPB Designs).</p>
    <button type="button" class="login-btn-google" onclick="startGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <div id="login-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-brand-block">
        <div class="app-title">IPTV <span>Tracker</span></div>
        <p class="header-tagline">Subscribers, renewals &amp; credentials</p>

function loadData() {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    // Migrate older records that don't have a phone field
    const parsed = JSON.parse(saved);
    parsed.forEach(e => { if (e.phone === undefined) e.phone = ''; });
    return parsed;
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(PRELOADED));
  return JSON.parse(JSON.stringify(PRELOADED));
}

let data = [];
function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
  if (currentUser) {
    fbDb.ref('iptv').set(data).catch(() => { showToast('Could not save to cloud'); });
  }
}

function migratePhoneRows(arr) {
  if (!arr || !Array.isArray(arr)) return [];
  arr.forEach(e => { if (e.phone === undefined) e.phone = ''; });
  return arr;
}

function refreshFromCloud() {
  if (!currentUser) return Promise.resolve();
  return fbDb.ref('iptv').once('value').then(snap => {
    const cloud = snap.val();
    if (cloud && Array.isArray(cloud) && cloud.length > 0) {
      data = migratePhoneRows(JSON.parse(JSON.stringify(cloud)));
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } else {
      data = loadData();
      return fbDb.ref('iptv').set(data).catch(() => {});
    }
  });
}

function isAllowedSyncEmail(email) {

function signInErrorMsg(e) {
  if (!e || !e.code) return 'Sign-in failed — try again';
  if (e.code === 'auth/unauthorized-domain') return 'In Firebase: Authentication → Settings → add this site under Authorized domains.';
  if (e.code === 'auth/popup-closed-by-user') return 'Sign-in was closed — try again.';
  if (e.code === 'auth/network-request-failed') return 'Network error — check your connection.';
  return e.message || 'Sign-in failed — try again';
}

/** Same pattern as PPB Designs: popup first, redirect if Safari blocks the popup. */
function startGoogleSignIn() {
  const le = document.getElementById('login-error');
  if (le) le.textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      fbAuth.signInWithRedirect(provider).catch(err => {
        if (le) le.textContent = signInErrorMsg(err);
      });
    } else {
      if (le) le.textContent = signInErrorMsg(e);
    }
  });
}

let toastTimer;

  const t = document.getElementById('toast');

  t.classList.add('show');

  const ms = String(msg).length > 55 ? 4800 : 2200;
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// Copy to clipboard
function copyText(text, label) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(label + ' copied!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(label + ' copied!');
  }
}

// Helpers
function addMonths(dateStr, n) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + parseInt(n));
  return d.toISOString().slice(0,10);
}
function daysLeft(renewal) {
  if (!renewal) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const r = new Date(renewal); r.setHours(0,0,0,0);
  return Math.round((r - today) / 86400000);
}
function statusKey(renewal) {
  const d = daysLeft(renewal);
  if (d === null) return 'nodate';
  if (d < 0) return 'overdue';
  if (d <= 60) return 'soon';
  return 'ok';
}
function statusBadge(renewal) {
  const d = daysLeft(renewal);
  if (d === null) return '<span class="badge nodate">No date</span>';
  if (d < 0) return `<span class="badge overdue">Overdue ${Math.abs(d)}d</span>`;
  if (d === 0) return '<span class="badge soon">Due today</span>';
  if (d <= 60) return `<span class="badge soon">Due in ${d}d</span>`;
  return '<span class="badge ok">Active</span>';
}
function fmtDate(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-jungle').className = 'tab' + (tab==='jungle'?' active-jungle':'');
  document.getElementById('tab-stream').className = 'tab' + (tab==='stream'?' active-stream':'');
  currentFilter = 'all';
  document.querySelectorAll('.filter-pill').forEach((p,i) => p.classList.toggle('active', i===0));
  render();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = data.filter(e => {
    if (e.service !== currentTab) return false;
    if (q && !e.name.toLowerCase().includes(q) && !e.user.toLowerCase().includes(q)) return false;
    if (currentFilter !== 'all' && statusKey(e.renewal) !== currentFilter) return false;
    return true;
  });
  const order = {overdue:0,soon:1,nodate:2,ok:3};
  list.sort((a,b) => {
    const diff = order[statusKey(a.renewal)] - order[statusKey(b.renewal)];
    if (diff !== 0) return diff;
    if (a.renewal && b.renewal) return new Date(a.renewal) - new Date(b.renewal);
    return a.name.localeCompare(b.name);
  });
  document.getElementById('count-label').textContent = `${list.length} subscriber${list.length!==1?'s':''}`;
  const container = document.getElementById('cards');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty">No subscribers found</div>';
  } else {
    container.innerHTML = list.map(e => {
      const shown = showPw[e.id];
      const sk = statusKey(e.renewal);
      const waBtn = e.phone ? `<button class="btn-sm wa" onclick="whatsapp('${e.id}')">WhatsApp</button>` : '';
      const renewBtn = (sk === 'overdue' || sk === 'soon') ? `<button class="btn-sm renew" onclick="openRenewModal('${e.id}')">Mark renewed</button>` : '';
      const notesHtml = e.notes ? `<div class="card-notes">${escHtml(e.notes)}</div>` : '';
      return `<div class="card ${e.service}">
        <div class="card-top">
          <div>
            <div class="card-name">${escHtml(e.name)}</div>
            <div class="card-tvs">${e.tvs} TV${e.tvs>1?'s':''} &middot; &euro;${parseFloat(e.price).toFixed(2)}</div>
          </div>
          ${statusBadge(e.renewal)}
        </div>
        <div class="card-creds">
          <div class="cred" onclick="copyUser('${e.id}')">
            <div class="cred-label">Username <span class="cred-copy-hint">tap to copy</span></div>
            <div class="cred-val">${escHtml(e.user)}</div>
          </div>
          <div class="cred" onclick="copyPass('${e.id}')">
            <div class="cred-label">Password <span class="cred-copy-hint">tap to copy</span></div>
            <div class="cred-val">${shown ? escHtml(e.pass) : '&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;'}</div>
          </div>
        </div>
        ${notesHtml}
        <div class="card-footer" style="margin-top:${notesHtml?'8px':'0'}">
          <div class="renewal-info">${e.renewal ? `Renews <strong>${fmtDate(e.renewal)}</strong>` : '<span style="color:var(--muted)">No renewal date set</span>'}</div>
          <div class="price-tag">&euro;${parseFloat(e.price).toFixed(2)}</div>
        </div>
        <div class="card-actions">
          <button class="btn-sm" onclick="togglePw('${e.id}')">${shown?'Hide pw':'Show pw'}</button>
          ${waBtn}
          ${renewBtn}
          <button class="btn-sm edit" onclick="editEntry('${e.id}')">Edit</button>
          <button class="btn-sm del" onclick="deleteEntry('${e.id}')">Remove</button>
        </div>
      </div>`;
    }).join('');
  }
  renderStats();
}

function renderStats() {
  const list = data.filter(e => e.service === currentTab);
  const overdue = list.filter(e => statusKey(e.renewal)==='overdue').length;
  const soon = list.filter(e => statusKey(e.renewal)==='soon').length;
  const revenue = list.reduce((s,e) => s + parseFloat(e.price||0), 0);
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-val">${list.length}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-val red">${overdue}</div><div class="stat-lbl">Overdue</div></div>
    <div class="stat-card"><div class="stat-val amber">${soon}</div><div class="stat-lbl">Due soon</div></div>
    <div class="stat-card"><div class="stat-val green">&euro;${revenue.toFixed(0)}</div><div class="stat-lbl">Value</div></div>
  `;
}

  editId = null;

  document.getElementById('f-name').value = '';
  document.getElementById('f-service').value = currentTab;
  document.getElementById('f-user').value = '';
  document.getElementById('f-pass').value = '';
  document.getElementById('f-tvs').value = '1';
  document.getElementById('f-price').value = '60';
  document.getElementById('f-start').value = '';
  document.getElementById('f-months').value = '12';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal-bg').classList.add('open');
}

function editEntry(id) {
  const e = data.find(x => x.id===id);
  if (!e) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit subscriber';
  document.getElementById('f-name').value = e.name;
  document.getElementById('f-service').value = e.service;
  document.getElementById('f-user').value = e.user;
  document.getElementById('f-pass').value = e.pass;
  document.getElementById('f-tvs').value = e.tvs||'1';
  document.getElementById('f-price').value = e.price||'60';
  document.getElementById('f-start').value = e.start||'';
  document.getElementById('f-months').value = e.months||'12';
  document.getElementById('f-phone').value = e.phone||'';
  document.getElementById('f-notes').value = e.notes||'';
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); editId = null; }
function handleModalBgClick(e) { if (e.target===document.getElementById('modal-bg')) closeModal(); }

function saveEntry() {
  const name = document.getElementById('f-name').value.trim();
  const user = document.getElementById('f-user').value.trim();
  const start = document.getElementById('f-start').value;
  if (!name || !user) { alert('Please enter at least a name and username.'); return; }
  const months = document.getElementById('f-months').value;
  const renewal = start ? addMonths(start, months) : '';
  const entry = {
    id: editId || Date.now().toString(),
    service: document.getElementById('f-service').value,
    name, user,
    pass: document.getElementById('f-pass').value.trim(),
    tvs: parseInt(document.getElementById('f-tvs').value),
    price: document.getElementById('f-price').value !== '' ? parseFloat(document.getElementById('f-price').value) : 60,
    start, renewal,
    months: parseInt(months),
    phone: document.getElementById('f-phone').value.trim(),
    notes: document.getElementById('f-notes').value.trim()
  };
  if (editId) {
    const idx = data.findIndex(x => x.id===editId);
    if (idx > -1) data[idx] = entry;
  } else {
    data.push(entry);
  }
  saveData();
  closeModal();
  render();
}

function deleteEntry(id) {
  if (!confirm('Remove this subscriber?')) return;
  data = data.filter(x => x.id !== id);
  saveData();
  render();
}

function applyTodayDateAndRender() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  render();
}

fbAuth.getRedirectResult().catch(err => {
  const le = document.getElementById('login-error');
  if (le && err && err.code && err.code !== 'auth/operation-not-supported-in-this-environment')
    le.textContent = signInErrorMsg(err);
});

fbAuth.onAuthStateChanged(user => {
  const le = document.getElementById('login-error');
  if (user) {
    if (!isAllowedSyncEmail(user.email)) {
      pendingDisallowMessage = 'That Google account is not allowed for this app.';
      fbAuth.signOut();
      return;
    }
    currentUser = user;
    if (le) le.textContent = '';
    showAuthPhase('app');
    refreshFromCloud().then(() => {
      applyTodayDateAndRender();
    }).catch(() => {
      data = loadData();
      applyTodayDateAndRender();
      showToast('Could not load cloud — showing local data');
    });
  } else {
    currentUser = null;
    data = [];
    if (pendingDisallowMessage && le) {
      le.textContent = pendingDisallowMessage;
      pendingDisallowMessage = '';
    } else if (le) {
      le.textContent = '';
    }
    showAuthPhase('login');
  }
});
</script>
</body>
</html>
