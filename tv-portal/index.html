<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV Tracker">
<meta name="robots" content="noindex, nofollow">
<title>IPTV Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f4;
    --muted: #8888a0;
    --accent: #6c63ff;
    --accent2: #4ecdc4;
    --danger: #ff6b6b;
    --warn: #ffa94d;
    --ok: #51cf66;
    --jungle: #6c63ff;
    --stream: #4ecdc4;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Auth (same idea as PPB Designs: Google first, then app) */
  #auth-loading {
    position: fixed; inset: 0; z-index: 1001;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted); font-size: 14px; gap: 12px;
  }
  #login-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, #1a0a2e 0%, var(--bg) 100%);
  }
  .login-card {
    width: 100%; max-width: 360px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 26px; text-align: center;
  }
  .login-card .login-brand { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 6px; }
  .login-card .login-brand span { color: var(--accent); }
  .login-card .login-sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 26px; }
  .login-btn-google {
    width: 100%; padding: 14px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--surface2); color: var(--text);
    font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .login-btn-google:active { opacity: 0.92; }
  .login-btn-google svg { flex-shrink: 0; }
  #login-error { font-size: 13px; color: var(--danger); margin-top: 14px; min-height: 20px; font-weight: 500; }

  /* MAIN APP */
  #app { display: none; padding-bottom: 100px; }

  .header { padding: 56px 20px 20px; background: linear-gradient(180deg, #1a0a2e 0%, var(--bg) 100%); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .app-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .app-title span { color: var(--accent); }
  .header-date { font-size: 12px; color: var(--muted); }
  .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hdr-signout { padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
  .hdr-signout:active { opacity: 0.9; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px 20px; }
  .stat-card { background: var(--surface); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
  .stat-val { font-size: 20px; font-weight: 600; }
  .stat-val.red { color: var(--danger); }
  .stat-val.amber { color: var(--warn); }
  .stat-val.green { color: var(--ok); }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .tabs { display: flex; gap: 8px; padding: 0 20px 16px; }
  .tab { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
  .tab.active-jungle { background: rgba(108,99,255,0.15); border-color: var(--jungle); color: var(--jungle); }
  .tab.active-stream { background: rgba(78,205,196,0.15); border-color: var(--stream); color: var(--stream); }

  .search-wrap { padding: 0 20px 12px; }
  .search { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; }
  .search:focus { outline: none; border-color: var(--border2); }
  .search::placeholder { color: var(--muted); }

  .filter-row { display: flex; gap: 6px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
  .filter-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.1); }

  .section-label { font-size: 11px; color: var(--muted); padding: 0 20px 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .cards { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card.jungle::before { background: var(--jungle); }
  .card.stream::before { background: var(--stream); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-tvs { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .badge.ok { background: rgba(81,207,102,0.15); color: var(--ok); }
  .badge.soon { background: rgba(255,169,77,0.15); color: var(--warn); }
  .badge.overdue { background: rgba(255,107,107,0.15); color: var(--danger); }
  .badge.nodate { background: rgba(136,136,160,0.15); color: var(--muted); }

  /* Credentials — tappable to copy */
  .card-creds { display: flex; gap: 8px; margin-bottom: 10px; }
  .cred { flex: 1; background: var(--surface2); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; cursor: pointer; position: relative; transition: background 0.15s; user-select: none; }
  .cred:active { background: #2e2e3e; }
  .cred.copied { background: rgba(81,207,102,0.15); }
  .cred-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
  .cred-copy-hint { font-size: 9px; color: var(--muted); opacity: 0.6; }
  .cred-val { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cred-copied-flash { position: absolute; inset: 0; background: rgba(81,207,102,0.2); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--ok); opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .cred-copied-flash.show { opacity: 1; }

  .card-footer { display: flex; justify-content: space-between; align-items: center; }
  .renewal-info { font-size: 12px; color: var(--muted); }
  .renewal-info strong { color: var(--text); }
  .price-tag { font-size: 13px; font-weight: 600; color: var(--accent2); }

  .card-notes { font-size: 11px; color: var(--muted); margin-top: 8px; padding: 6px 10px; background: var(--surface2); border-radius: var(--radius-sm); border-left: 2px solid var(--border2); }

  .card-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .btn-sm { flex: 1; min-width: 60px; padding: 8px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
  .btn-sm.edit { color: var(--accent); border-color: rgba(108,99,255,0.3); }
  .btn-sm.del { color: var(--danger); border-color: rgba(255,107,107,0.3); }
  .btn-sm.wa { color: #25d366; border-color: rgba(37,211,102,0.3); }
  .btn-sm.renew { color: var(--warn); border-color: rgba(255,169,77,0.3); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  /* Toast */
  #toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); max-width: min(340px, 92vw); background: #2a2a38; border: 1px solid var(--border2); color: var(--text); padding: 12px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 500; white-space: normal; text-align: center; line-height: 1.35; }
  #toast.show { opacity: 1; }

  /* Renew modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
  .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 13px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; -webkit-appearance: none; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field select option { background: var(--surface2); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save { flex: 2; padding: 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .btn-cancel { flex: 1; padding: 14px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px 28px; }
  .nav-add { width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }

</style>
</head>

<div id="auth-loading">
  <div style="font-size:28px">&#x1F4FA;</div>

</div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">IPTV <span>Tracker</span></div>
    <p class="login-sub">Sign in with your Google account to load and sync your subscriber list (same idea as PPB Designs).</p>
    <button type="button" class="login-btn-google" onclick="startGoogleSignIn()">

      Sign in with Google

</div>

<!-- MAIN APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="app-title">IPTV <span>Tracker</span></div>
        <div class="header-date" id="today-date"></div>
      </div>
      <div class="header-btns">
        <button class="icon-btn" onclick="exportData()" title="Export backup">&#x1F4BE;</button>
        <button type="button" class="hdr-signout" onclick="signOutApp()" title="Sign out">Sign out</button>
      </div>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="tabs">
    <button class="tab active-jungle" onclick="switchTab('jungle')" id="tab-jungle">Jungle TV</button>
    <button class="tab" onclick="switchTab('stream')" id="tab-stream">Stream</button>
  </div>

  <div class="search-wrap">
    <input class="search" type="text" placeholder="Search subscribers..." oninput="render()" id="search-input">
  </div>

  <div class="filter-row">
    <button class="filter-pill active" onclick="setFilter('all',this)">All</button>
    <button class="filter-pill" onclick="setFilter('overdue',this)">Overdue</button>
    <button class="filter-pill" onclick="setFilter('soon',this)">Due soon</button>
    <button class="filter-pill" onclick="setFilter('ok',this)">Active</button>
    <button class="filter-pill" onclick="setFilter('nodate',this)">No date</button>
  </div>

  <div class="section-label" id="count-label"></div>
  <div class="cards" id="cards"></div>

  <div class="bottom-nav">
    <button class="nav-add" onclick="openModal()">+ Add subscriber</button>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="modal-bg" onclick="handleModalBgClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modal-title">Add subscriber</h2>
    <div class="field"><label>Customer name</label><input id="f-name" type="text" placeholder="e.g. John Murphy"></div>
    <div class="field"><label>Service</label>
      <select id="f-service">
        <option value="jungle">Jungle TV</option>
        <option value="stream">Stream</option>
      </select>
    </div>
    <div class="two-col">
      <div class="field"><label>Username</label><input id="f-user" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
      <div class="field"><label>Password</label><input id="f-pass" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>No. of TVs</label>
        <select id="f-tvs"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      </div>
      <div class="field"><label>Price (&euro;)</label><input id="f-price" type="number" min="0" step="0.01" placeholder="60"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Start date</label><input id="f-start" type="date"></div>
      <div class="field"><label>Sub length</label>
        <select id="f-months">
          <option value="1">1 month</option>
          <option value="3">3 months</option>
          <option value="6">6 months</option>
          <option value="12" selected>12 months</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Phone number</label>
      <input id="f-phone" type="tel" autocomplete="off" placeholder="e.g. 083 123 4567">
      <div class="field-hint">Used for WhatsApp reminders. Include country code or start with 0.</div>
    </div>
    <div class="field"><label>Notes (optional)</label><input id="f-notes" type="text" placeholder=""></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<!-- Mark Renewed Modal -->
<div class="modal-bg" id="renew-modal-bg" onclick="handleRenewBgClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Mark as renewed</h2>
    <div class="field">
      <label>New start date</label>
      <input id="r-start" type="date">
    </div>
    <div class="field">
      <label>Sub length</label>
      <select id="r-months">
        <option value="1">1 month</option>
        <option value="3">3 months</option>
        <option value="6">6 months</option>
        <option value="12" selected>12 months</option>
      </select>
    </div>
    <div class="field">
      <label>Price (&euro;)</label>
      <input id="r-price" type="number" min="0" step="0.01">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeRenewModal()">Cancel</button>
      <button class="btn-save" onclick="confirmRenew()">Confirm renewal</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

function showAuthPhase(phase) {
  const load = document.getElementById('auth-loading');
  const login = document.getElementById('login-screen');
  const appEl = document.getElementById('app');
  if (phase === 'loading') {
    load.style.display = 'flex';
    login.style.display = 'none';
    appEl.style.display = 'none';
  } else if (phase === 'login') {
    load.style.display = 'none';
    login.style.display = 'flex';
    appEl.style.display = 'none';
  } else {
    load.style.display = 'none';
    login.style.display = 'none';
    appEl.style.display = 'block';
  }
}

function loadData() {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    // Migrate older records that don't have a phone field
    const parsed = JSON.parse(saved);
    parsed.forEach(e => { if (e.phone === undefined) e.phone = ''; });
    return parsed;
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(PRELOADED));
  return JSON.parse(JSON.stringify(PRELOADED));
}

let data = [];
function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
  if (currentUser) {
    fbDb.ref('users/' + currentUser.uid + '/iptv').set(data).catch(() => { showToast('Could not save to cloud'); });
  }
}

function migratePhoneRows(arr) {
  if (!arr || !Array.isArray(arr)) return [];
  arr.forEach(e => { if (e.phone === undefined) e.phone = ''; });
  return arr;
}

function refreshFromCloud() {
  if (!currentUser) return Promise.resolve();
  return fbDb.ref('users/' + currentUser.uid + '/iptv').once('value').then(snap => {
    const cloud = snap.val();
    if (cloud && Array.isArray(cloud) && cloud.length > 0) {
      data = migratePhoneRows(JSON.parse(JSON.stringify(cloud)));
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } else {
      data = loadData();
      return fbDb.ref('users/' + currentUser.uid + '/iptv').set(data).catch(() => {});
    }
  });
}

function isAllowedSyncEmail(email) {
  if (!email) return false;
  const l = email.toLowerCase();
  return ALLOWED_SYNC_EMAILS.some(a => a.toLowerCase() === l);
}

function signInErrorMsg(e) {
  if (!e || !e.code) return 'Sign-in failed — try again';
  if (e.code === 'auth/unauthorized-domain') return 'In Firebase: Authentication → Settings → add this site under Authorized domains.';
  if (e.code === 'auth/popup-closed-by-user') return 'Sign-in was closed — try again.';
  if (e.code === 'auth/network-request-failed') return 'Network error — check your connection.';
  return e.message || 'Sign-in failed — try again';
}

/** Same pattern as PPB Designs: popup first, redirect if Safari blocks the popup. */
function startGoogleSignIn() {
  const le = document.getElementById('login-error');
  if (le) le.textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      fbAuth.signInWithRedirect(provider).catch(err => {
        if (le) le.textContent = signInErrorMsg(err);
      });
    } else {
      if (le) le.textContent = signInErrorMsg(e);
    }
  });
}

// Export backup as JSON file
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iptv-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

// Toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  const ms = String(msg).length > 55 ? 4800 : 2200;
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// Copy to clipboard
function copyText(text, label) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(label + ' copied!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(label + ' copied!');
  }
}

function copyUser(id) {
  const e = data.find(x => x.id === id);
  if (e) copyText(e.user, 'Username');
}
function copyPass(id) {
  const e = data.find(x => x.id === id);
  if (e) copyText(e.pass, 'Password');
}

// WhatsApp
function whatsapp(id) {
  const e = data.find(x => x.id === id);
  if (!e || !e.phone) return;
  let num = e.phone.replace(/[\s\-().+]/g, '');
  if (num.startsWith('0')) num = '353' + num.slice(1);
  const status = statusKey(e.renewal);
  let msg;
  if (status === 'overdue') {
    msg = `Hi ${e.name.split(' ')[0]}! Just a reminder your IPTV subscription has expired. To renew for ${e.months} month(s) it's €${parseFloat(e.price).toFixed(0)}. Let me know if you'd like to continue 😊`;
  } else if (status === 'soon') {
    msg = `Hi ${e.name.split(' ')[0]}! Just to let you know your IPTV is due to renew on ${fmtDate(e.renewal)}. ${e.months} month(s) for €${parseFloat(e.price).toFixed(0)}. Give me a shout when you're ready 😊`;
  } else {
    msg = `Hi ${e.name.split(' ')[0]}! Just checking in about your IPTV subscription. Give me a shout if you need anything 😊`;
  }
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Mark renewed modal
function openRenewModal(id) {
  renewId = id;
  const e = data.find(x => x.id === id);
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('r-start').value = today;
  document.getElementById('r-months').value = e.months || '12';
  document.getElementById('r-price').value = e.price || '60';
  document.getElementById('renew-modal-bg').classList.add('open');
}
function closeRenewModal() {
  document.getElementById('renew-modal-bg').classList.remove('open');
  renewId = null;
}
function handleRenewBgClick(ev) {
  if (ev.target === document.getElementById('renew-modal-bg')) closeRenewModal();
}
function confirmRenew() {
  const idx = data.findIndex(x => x.id === renewId);
  if (idx < 0) return;
  const start = document.getElementById('r-start').value;
  const months = parseInt(document.getElementById('r-months').value);
  const rPriceVal = document.getElementById('r-price').value;
  const price = rPriceVal !== '' ? parseFloat(rPriceVal) : data[idx].price;
  data[idx].start = start;
  data[idx].renewal = addMonths(start, months);
  data[idx].months = months;
  data[idx].price = price;
  saveData();
  closeRenewModal();
  render();
  showToast('Renewal saved!');
}

// Helpers
function addMonths(dateStr, n) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + parseInt(n));
  return d.toISOString().slice(0,10);
}
function daysLeft(renewal) {
  if (!renewal) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const r = new Date(renewal); r.setHours(0,0,0,0);
  return Math.round((r - today) / 86400000);
}
function statusKey(renewal) {
  const d = daysLeft(renewal);
  if (d === null) return 'nodate';
  if (d < 0) return 'overdue';
  if (d <= 60) return 'soon';
  return 'ok';
}
function statusBadge(renewal) {
  const d = daysLeft(renewal);
  if (d === null) return '<span class="badge nodate">No date</span>';
  if (d < 0) return `<span class="badge overdue">Overdue ${Math.abs(d)}d</span>`;
  if (d === 0) return '<span class="badge soon">Due today</span>';
  if (d <= 60) return `<span class="badge soon">Due in ${d}d</span>`;
  return '<span class="badge ok">Active</span>';
}
function fmtDate(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-jungle').className = 'tab' + (tab==='jungle'?' active-jungle':'');
  document.getElementById('tab-stream').className = 'tab' + (tab==='stream'?' active-stream':'');
  currentFilter = 'all';
  document.querySelectorAll('.filter-pill').forEach((p,i) => p.classList.toggle('active', i===0));
  render();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = data.filter(e => {
    if (e.service !== currentTab) return false;
    if (q && !e.name.toLowerCase().includes(q) && !e.user.toLowerCase().includes(q)) return false;
    if (currentFilter !== 'all' && statusKey(e.renewal) !== currentFilter) return false;
    return true;
  });
  const order = {overdue:0,soon:1,nodate:2,ok:3};
  list.sort((a,b) => {
    const diff = order[statusKey(a.renewal)] - order[statusKey(b.renewal)];
    if (diff !== 0) return diff;
    if (a.renewal && b.renewal) return new Date(a.renewal) - new Date(b.renewal);
    return a.name.localeCompare(b.name);
  });
  document.getElementById('count-label').textContent = `${list.length} subscriber${list.length!==1?'s':''}`;
  const container = document.getElementById('cards');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty">No subscribers found</div>';
  } else {
    container.innerHTML = list.map(e => {
      const shown = showPw[e.id];
      const sk = statusKey(e.renewal);
      const waBtn = e.phone ? `<button class="btn-sm wa" onclick="whatsapp('${e.id}')">WhatsApp</button>` : '';
      const renewBtn = (sk === 'overdue' || sk === 'soon') ? `<button class="btn-sm renew" onclick="openRenewModal('${e.id}')">Mark renewed</button>` : '';
      const notesHtml = e.notes ? `<div class="card-notes">${escHtml(e.notes)}</div>` : '';
      return `<div class="card ${e.service}">
        <div class="card-top">
          <div>
            <div class="card-name">${escHtml(e.name)}</div>
            <div class="card-tvs">${e.tvs} TV${e.tvs>1?'s':''} &middot; &euro;${parseFloat(e.price).toFixed(2)}</div>
          </div>
          ${statusBadge(e.renewal)}
        </div>
        <div class="card-creds">
          <div class="cred" onclick="copyUser('${e.id}')">
            <div class="cred-label">Username <span class="cred-copy-hint">tap to copy</span></div>
            <div class="cred-val">${escHtml(e.user)}</div>
          </div>
          <div class="cred" onclick="copyPass('${e.id}')">
            <div class="cred-label">Password <span class="cred-copy-hint">tap to copy</span></div>
            <div class="cred-val">${shown ? escHtml(e.pass) : '&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;'}</div>
          </div>
        </div>
        ${notesHtml}
        <div class="card-footer" style="margin-top:${notesHtml?'8px':'0'}">
          <div class="renewal-info">${e.renewal ? `Renews <strong>${fmtDate(e.renewal)}</strong>` : '<span style="color:var(--muted)">No renewal date set</span>'}</div>
          <div class="price-tag">&euro;${parseFloat(e.price).toFixed(2)}</div>
        </div>
        <div class="card-actions">
          <button class="btn-sm" onclick="togglePw('${e.id}')">${shown?'Hide pw':'Show pw'}</button>
          ${waBtn}
          ${renewBtn}
          <button class="btn-sm edit" onclick="editEntry('${e.id}')">Edit</button>
          <button class="btn-sm del" onclick="deleteEntry('${e.id}')">Remove</button>
        </div>
      </div>`;
    }).join('');
  }
  renderStats();
}

function renderStats() {
  const list = data.filter(e => e.service === currentTab);
  const overdue = list.filter(e => statusKey(e.renewal)==='overdue').length;
  const soon = list.filter(e => statusKey(e.renewal)==='soon').length;
  const revenue = list.reduce((s,e) => s + parseFloat(e.price||0), 0);
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-val">${list.length}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-val red">${overdue}</div><div class="stat-lbl">Overdue</div></div>
    <div class="stat-card"><div class="stat-val amber">${soon}</div><div class="stat-lbl">Due soon</div></div>
    <div class="stat-card"><div class="stat-val green">&euro;${revenue.toFixed(0)}</div><div class="stat-lbl">Value</div></div>
  `;
}

function togglePw(id) { showPw[id] = !showPw[id]; render(); }

function openModal() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Add subscriber';
  document.getElementById('f-name').value = '';
  document.getElementById('f-service').value = currentTab;
  document.getElementById('f-user').value = '';
  document.getElementById('f-pass').value = '';
  document.getElementById('f-tvs').value = '1';
  document.getElementById('f-price').value = '60';
  document.getElementById('f-start').value = '';
  document.getElementById('f-months').value = '12';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal-bg').classList.add('open');
}

function editEntry(id) {
  const e = data.find(x => x.id===id);
  if (!e) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit subscriber';
  document.getElementById('f-name').value = e.name;
  document.getElementById('f-service').value = e.service;
  document.getElementById('f-user').value = e.user;
  document.getElementById('f-pass').value = e.pass;
  document.getElementById('f-tvs').value = e.tvs||'1';
  document.getElementById('f-price').value = e.price||'60';
  document.getElementById('f-start').value = e.start||'';
  document.getElementById('f-months').value = e.months||'12';
  document.getElementById('f-phone').value = e.phone||'';
  document.getElementById('f-notes').value = e.notes||'';
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); editId = null; }
function handleModalBgClick(e) { if (e.target===document.getElementById('modal-bg')) closeModal(); }

function saveEntry() {
  const name = document.getElementById('f-name').value.trim();
  const user = document.getElementById('f-user').value.trim();
  const start = document.getElementById('f-start').value;
  if (!name || !user) { alert('Please enter at least a name and username.'); return; }
  const months = document.getElementById('f-months').value;
  const renewal = start ? addMonths(start, months) : '';
  const entry = {
    id: editId || Date.now().toString(),
    service: document.getElementById('f-service').value,
    name, user,
    pass: document.getElementById('f-pass').value.trim(),
    tvs: parseInt(document.getElementById('f-tvs').value),
    price: document.getElementById('f-price').value !== '' ? parseFloat(document.getElementById('f-price').value) : 60,
    start, renewal,
    months: parseInt(months),
    phone: document.getElementById('f-phone').value.trim(),
    notes: document.getElementById('f-notes').value.trim()
  };
  if (editId) {
    const idx = data.findIndex(x => x.id===editId);
    if (idx > -1) data[idx] = entry;
  } else {
    data.push(entry);
  }
  saveData();
  closeModal();
  render();
}

function deleteEntry(id) {
  if (!confirm('Remove this subscriber?')) return;
  data = data.filter(x => x.id !== id);
  saveData();
  render();
}

function applyTodayDateAndRender() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  render();
}

fbAuth.getRedirectResult().catch(err => {
  const le = document.getElementById('login-error');
  if (le && err && err.code && err.code !== 'auth/operation-not-supported-in-this-environment')
    le.textContent = signInErrorMsg(err);
});

fbAuth.onAuthStateChanged(user => {
  const le = document.getElementById('login-error');
  if (user) {
    if (!isAllowedSyncEmail(user.email)) {
      pendingDisallowMessage = 'That Google account is not allowed for this app.';
      fbAuth.signOut();
      return;
    }
    currentUser = user;
    if (le) le.textContent = '';
    showAuthPhase('app');
    refreshFromCloud().then(() => {
      applyTodayDateAndRender();
    }).catch(() => {
      data = loadData();
      applyTodayDateAndRender();
      showToast('Could not load cloud — showing local data');
    });
  } else {
    currentUser = null;
    data = [];
    if (pendingDisallowMessage && le) {
      le.textContent = pendingDisallowMessage;
      pendingDisallowMessage = '';
    } else if (le) {
      le.textContent = '';
    }
    showAuthPhase('login');
  }
});
